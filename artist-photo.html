<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artist Profile Picture | LAE-MUSIC</title><style>body{margin:0;background:#0d0c18;color:white;font:16px/1.6 system-ui}main{max-width:560px;margin:50px auto;padding:25px;background:#21192f;border-radius:20px}a{color:#ffa4d9}h1{line-height:1.2}input,button{display:block;margin:20px 0}button{background:#d33d98;color:white;border:0;border-radius:10px;padding:14px 22px;font-weight:bold;cursor:pointer}img{width:180px;height:180px;object-fit:cover;border-radius:50%;display:none;border:3px solid #e34ca5}p{color:#d4cadd}</style></head><body><main><a href="/artist">← Back to Artist Studio</a><h1>Your Artist Profile Picture</h1><p>This is your public artist photo in Discover Artists. It is separate from the cover images uploaded with your songs.</p><img id="preview" alt="Selected artist profile photo"><label for="photo">Choose a photo (JPEG, PNG or WebP)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">Upload Profile Picture</button><p id="status" role="status"></p></main><script>
const file=document.getElementById('photo'),preview=document.getElementById('preview'),status=document.getElementById('status'),button=document.getElementById('upload');file.onchange=()=>{const f=file.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display='block'};
button.onclick=async()=>{const f=file.files[0];if(!f){status.textContent='Choose a photo first.';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){status.textContent='Use JPEG, PNG or WebP.';return}button.disabled=true;status.textContent='Preparing photo…';try{const img=await createImageBitmap(f),canvas=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();const uri=canvas.toDataURL('image/jpeg',.8),data=uri.split(',')[1];if(data.length>950000)throw Error('Image is too large. Choose a smaller photo.');status.textContent='Uploading…';const r=await fetch('/api/artist/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mime:'image/jpeg',data})}),j=await r.json();if(!r.ok)throw Error(j.error||'Upload failed');status.textContent='Profile picture saved. It will appear in Discover Artists.'}catch(e){status.textContent=e.message}finally{button.disabled=false}};
</script></body></html>

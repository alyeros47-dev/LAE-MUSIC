<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAE-MUSIC · Comment Moderation</title><style>body{font:16px system-ui;background:#100c1d;color:#fff;margin:0;padding:22px}main{max-width:850px;margin:auto}a{color:#ff9bd1}button,select{padding:10px 14px;margin:4px;border-radius:9px;border:1px solid #ffffff55;background:#a22b80;color:white;cursor:pointer}article{border:1px solid #ffffff33;border-radius:14px;padding:15px;margin:12px 0;background:#ffffff0d}small{color:#cbbbd3}h1{font-size:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}#status{color:#ffd0e7}</style></head><body><main><a href="/artist">← Artist studio</a> · <a href="/listen">Music homepage</a><h1>Comment Moderation</h1><p>Review public conversations, hide harmful comments, and manage reports. Artists can moderate their own songs. Administrators can review held or reported comments.</p><div class="toolbar"><button id="artistMode">My songs and notifications</button><button id="adminMode">Admin review queue</button><button id="reload">Refresh</button></div><p id="status" role="status"></p><h2 id="heading">My songs</h2><div id="notifications"></div><div id="items"></div></main><script>const $=id=>document.getElementById(id);let mode='artist';async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}async function load(){const box=$('items');box.replaceChildren();$('status').textContent='Loading…';$('notifications').replaceChildren();try{const base=mode==='artist'?'/api/artist/comment-moderation':'/api/admin/comment-moderation';const j=await api(base);$('heading').textContent=mode==='artist'?'Comments on my songs':'Admin moderation queue';$('status').textContent=j.comments.length+' comments';for(const c of j.comments){const a=el('article');a.append(el('strong',c.author+' · '+c.song),el('p',c.body),el('small','Status: '+c.status+' · Reports: '+c.reports));for(const action of mode==='artist'?['hide','approve']:['approve','hide','delete']){const b=el('button',action[0].toUpperCase()+action.slice(1));b.onclick=async()=>{if(action==='delete'&&!confirm('Permanently delete this comment?'))return;b.disabled=true;try{await api(base,'POST',{commentId:c.id,action});await load()}catch(e){$('status').textContent=e.message;b.disabled=false}};a.append(b)}box.append(a)}if(mode==='artist'){const n=await api('/api/artist/comment-notifications');const panel=el('article');panel.append(el('h2','Recent comment notifications'));for(const x of n.notifications.slice(0,15))panel.append(el('p',x.author+' commented on '+x.song+' · '+new Date(x.created_at).toLocaleString()));if(!n.notifications.length)panel.append(el('p','No recent public comments.'));$('notifications').append(panel)}}catch(e){$('status').textContent=e.message+' — Sign in to the correct account first.'}}$('artistMode').onclick=()=>{mode='artist';load()};$('adminMode').onclick=()=>{mode='admin';load()};$('reload').onclick=load;load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listener Account | LAE-MUSIC</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,#53204e,transparent 45%),#0c0b18;color:#fff;font:16px/1.5 system-ui}header{padding:22px max(20px,calc((100vw - 900px)/2));border-bottom:1px solid #ffffff25}a{color:#ffacd8}main{max-width:900px;margin:auto;padding:45px 20px}.panel{max-width:500px;background:#1c192d;border:1px solid #ffffff27;border-radius:20px;padding:28px;margin-top:25px}h1{font-size:clamp(32px,5vw,52px);margin:10px 0}p{color:#c9c3d7}label{display:block;margin-top:14px}input{display:block;width:100%;margin-top:6px;background:#100f20;border:1px solid #5a4e68;color:white;border-radius:10px;padding:13px;font:inherit}button{background:linear-gradient(100deg,#ff4da6,#9445dd);color:#fff;border:0;border-radius:12px;padding:13px 19px;margin-top:19px;font:700 16px system-ui;cursor:pointer}.tabs{display:flex;gap:10px}.tabs button{margin:0;background:#3a2c50}.tabs button.active{background:#b53e83}.hide{display:none}#status{color:#ffd19c;min-height:26px}</style><style id="accountVisualRefresh">
body{min-height:100vh;background:radial-gradient(circle at 80% 10%,#61234b66,transparent 40%),#0b0915;font-family:system-ui,-apple-system,sans-serif}
header{max-width:1250px;margin:auto;padding:20px 26px;border:0;font-weight:700}
main{max-width:1250px;min-height:calc(100vh - 80px);padding:35px 26px 65px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);column-gap:clamp(35px,7vw,100px);align-content:center;align-items:center}
main>h1{grid-column:1;grid-row:1;font-size:clamp(44px,5.7vw,78px);line-height:1.02;letter-spacing:-2px;max-width:630px;margin:0 0 20px}
main>p{grid-column:1;grid-row:2;font-size:18px;max-width:520px;margin:0 0 30px}
main:before{content:'';grid-column:1;grid-row:3;display:block;width:100%;height:clamp(210px,25vw,330px);border-radius:24px;background:linear-gradient(0deg,#120c1f99,#120c1f00 65%),url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1100&q=85') center/cover no-repeat;box-shadow:0 28px 70px #0008}
.panel{grid-column:2;grid-row:1/span 3;max-width:none;width:100%;margin:0;padding:clamp(24px,3vw,40px);background:linear-gradient(150deg,#262038f5,#171323f5);border:1px solid #ffffff30;box-shadow:0 30px 80px #0008;backdrop-filter:blur(16px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}.tabs button{padding:13px 8px;font-size:14px}.panel form button{width:100%;min-height:48px}
input:focus{outline:2px solid #e75eac;outline-offset:1px}
@media(max-width:800px){main{display:block;min-height:auto;padding:25px 18px 65px}main>h1{font-size:clamp(36px,9vw,55px)}main>p{font-size:16px}main:before{height:190px;margin-bottom:22px}.panel{max-width:560px;margin:0 auto;padding:24px}}
</style></head><body><header><a href="/">← LAE-MUSIC Home</a> · <a href="/listener/dashboard">My Dashboard</a></header><main><h1>Your music. Your space.</h1><p>Create a free listener account to start building your own music experience. Artist publishing memberships are separate.</p><div class="panel"><div class="tabs"><button id="registerTab" class="active" type="button">Create Account</button><button id="loginTab" type="button">Sign In</button></div><form id="registerForm"><label>Display name<input name="name" autocomplete="name" required minlength="2" maxlength="100"></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password (10+ characters)<input name="password" type="password" autocomplete="new-password" required minlength="10"></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="10"></label><button>Create Free Listener Account</button></form><form id="loginForm" class="hide"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign In</button></form><p id="status" role="status"></p></div></main><script>
const $=id=>document.getElementById(id);const show=mode=>{const reg=mode==='register';$('registerForm').classList.toggle('hide',!reg);$('loginForm').classList.toggle('hide',reg);$('registerTab').classList.toggle('active',reg);$('loginTab').classList.toggle('active',!reg);$('status').textContent=''};$('registerTab').onclick=()=>show('register');$('loginTab').onclick=()=>show('login');if(location.hash==='#signin')show('login');
async function send(url,form){const data=Object.fromEntries(new FormData(form));$('status').textContent='Please wait…';const b=form.querySelector('button[type=submit],button:last-child');b.disabled=true;try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');location.href=(new URLSearchParams(location.search).get('next')||'/')}catch(e){$('status').textContent=e.message}finally{b.disabled=false}}
$('registerForm').onsubmit=e=>{e.preventDefault();send('/api/listener/register',e.currentTarget)};$('loginForm').onsubmit=e=>{e.preventDefault();send('/api/listener/login',e.currentTarget)};
</script></body></html>

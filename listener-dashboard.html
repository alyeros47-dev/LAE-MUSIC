<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0914"><title>My Music · LAE-MUSIC</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0914;color:#fff;font:15px/1.5 system-ui}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer;border:0;background:#e9479e;color:#fff;border-radius:24px;padding:11px 18px;font-weight:700}button.secondary{background:#ffffff19;border:1px solid #ffffff2b}header{position:sticky;top:0;z-index:10;background:#141022f5;border-bottom:1px solid #ffffff20;padding:15px max(18px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand span{color:#f44fa9}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}nav a{color:#eee1ef}main{max-width:1120px;margin:auto;padding:25px 18px 90px}.hero{padding:35px 24px;border-radius:24px;background:linear-gradient(115deg,#522044,#251a3f 58%,#171326);border:1px solid #ffffff22}.eyebrow{color:#ff9ccf;font-size:12px;letter-spacing:2px;font-weight:800}.hero h1{font-size:clamp(28px,6vw,48px);margin:12px 0}.hero p{color:#dfd1e2;max-width:600px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.section{margin-top:34px}.section h2{font-size:24px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}.card{background:#1c172b;border:1px solid #ffffff1b;border-radius:17px;padding:18px;min-width:0}.card h3{margin:0 0 8px}.muted{color:#bdb1c8}.track{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #ffffff18}.track:first-child{border-top:0}.art{width:58px;height:58px;flex:none;border-radius:10px;object-fit:cover;background:#32283e}.track-info{flex:1;min-width:0}.track-info strong,.track-info small{display:block;overflow-wrap:anywhere}.track-info small{color:#c2b6cc}.track button{padding:8px 12px;font-size:13px}input{min-width:0;padding:12px 14px;border:1px solid #ffffff40;background:#171324;color:white;border-radius:12px}form{display:flex;gap:8px;flex-wrap:wrap}form input{flex:1;min-width:170px}.empty{padding:20px;color:#c7bdd1;background:#1c172b;border-radius:14px}.notice{color:#ffb9d9;min-height:20px}.playlist-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}@media(max-width:480px){header{align-items:flex-start}nav{font-size:13px;gap:10px}.hero{padding:25px 18px}.track{flex-wrap:wrap}}</style></head><body><header><a class="brand" href="/">LAE<span> MUSIC</span></a><nav><a href="/#discover">Discover</a><a href="/#artistsSection">Artists</a><a href="/music">Library</a><button class="secondary" id="logout">Sign out</button></nav></header><main><div class="hero"><span class="eyebrow">YOUR PERSONAL MUSIC SPACE</span><h1 id="welcome">My Music</h1><p>Enjoy music, follow your favorite artists, and keep your playlists and recently played songs together.</p><div class="actions"><a href="/#discover"><button>▶ Play music</button></a><a href="/#artistsSection"><button class="secondary">Discover artists</button></a></div></div><section class="section"><h2>My favorite artists</h2><div id="favoriteList" class="grid"><p class="muted">Loading artists…</p></div></section><section class="section"><h2>My playlists</h2><form id="newPlaylist"><input id="playlistName" maxlength="80" required placeholder="Name your new playlist" aria-label="Playlist name"><button type="submit">＋ Create playlist</button></form><p id="playlistStatus" class="notice" role="status"></p><div id="playlistList" class="grid"></div></section><section class="section"><h2>Recently played</h2><div id="historyList" class="grid"><p class="muted">Loading your music…</p></div></section><p id="status" class="notice" role="status"></p></main><script>const $=id=>document.getElementById(id);const make=(tag,content,cls)=>{const n=document.createElement(tag);if(content!==undefined)n.textContent=content;if(cls)n.className=cls;return n};async function call(url,options){const r=await fetch(url,{credentials:'same-origin',...options});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function playLink(t){return '/?play='+encodeURIComponent(t.id)+'#discover'}async function playlists(){const box=$('playlistList');box.replaceChildren();try{const j=await call('/api/listener/playlists');if(!j.playlists.length)box.append(make('div','Your playlists will appear here. Create one above or save a song while listening.','empty'));for(const p of j.playlists){const c=make('article',undefined,'card'),h=make('h3',p.name),count=make('p',p.song_count+' '+(Number(p.song_count)===1?'song':'songs'),'muted'),list=make('div'),actions=make('div',undefined,'playlist-actions'),view=make('button','View songs','secondary'),del=make('button','Delete','secondary');view.onclick=async()=>{if(list.childNodes.length){list.replaceChildren();view.textContent='View songs';return}view.textContent='Hide songs';try{const data=await call('/api/listener/playlist/tracks?playlistId='+encodeURIComponent(p.id));if(!data.tracks.length)list.append(make('p','No songs yet.','muted'));for(const t of data.tracks){const line=make('div',undefined,'track'),art=make('img',undefined,'art'),info=make('div',undefined,'track-info'),title=make('strong',t.title),artist=make('small',t.artist),play=make('a','▶ Listen'),remove=make('button','Remove','secondary');art.src='/api/music/tracks/'+encodeURIComponent(t.id)+'/cover-image';art.alt='';info.append(title,artist);play.href=playLink(t);remove.onclick=async()=>{try{await call('/api/listener/playlist/tracks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playlistId:p.id,trackId:t.id,action:'remove'})});await playlists()}catch(e){$('playlistStatus').textContent=e.message}};line.append(art,info,play,remove);list.append(line)}}catch(e){list.textContent=e.message}};del.onclick=async()=>{if(!confirm('Delete playlist '+p.name+'?'))return;try{await call('/api/listener/playlist/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playlistId:p.id})});await playlists()}catch(e){$('playlistStatus').textContent=e.message}};actions.append(view,del);c.append(h,count,actions,list);box.append(c)}}catch(e){box.append(make('div',e.message,'empty'))}}async function history(){const box=$('historyList');box.replaceChildren();try{const j=await call('/api/listener/history');if(!j.tracks.length)box.append(make('div','Your recently played songs will appear here.','empty'));for(const t of j.tracks){const c=make('article',undefined,'card'),line=make('div',undefined,'track'),art=make('img',undefined,'art'),info=make('div',undefined,'track-info'),play=make('a','▶ Play');art.src='/api/music/tracks/'+encodeURIComponent(t.id)+'/cover-image';art.alt='';info.append(make('strong',t.title),make('small',t.artist+' · '+t.play_count+' plays'));play.href=playLink(t);line.append(art,info,play);c.append(line);box.append(c)}}catch(e){box.append(make('div',e.message,'empty'))}}async function favorites(){const box=$('favoriteList');box.replaceChildren();try{const j=await call('/api/listener/favorites');if(!j.artists.length)box.append(make('div','No favorite artists yet. Discover artists and add your favorites.','empty'));for(const a of j.artists){const c=make('article',undefined,'card');c.append(make('h3',a.name));const link=make('a','Discover more music →');link.href='/#artistsSection';c.append(link);box.append(c)}}catch(e){box.append(make('div',e.message,'empty'))}}$('newPlaylist').onsubmit=async e=>{e.preventDefault();try{await call('/api/listener/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('playlistName').value})});$('playlistName').value='';$('playlistStatus').textContent='Playlist created.';await playlists()}catch(e){$('playlistStatus').textContent=e.message}};$('logout').onclick=async()=>{try{await call('/api/listener/logout',{method:'POST'});location.href='/'}catch(e){$('status').textContent=e.message}};(async()=>{try{const j=await call('/api/listener/me');$('welcome').textContent='Welcome, '+j.user.display_name;await Promise.all([playlists(),history(),favorites()])}catch(e){location.href='/listener/account#signin'}})();</script></body></html>

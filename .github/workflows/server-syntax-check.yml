name: Server JavaScript syntax check
on:
  push:
    paths:
      - 'server.js'
      - 'musicapi-sonic.js'
      - 'scripts/check-lae-integrity.cjs'
      - 'scripts/check-sonic-workflow.cjs'
      - 'package.json'
      - '.github/workflows/server-syntax-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: |
          node --check server.js
          node --check musicapi-sonic.js
          node --check scripts/check-lae-integrity.cjs
          node --check scripts/check-sonic-workflow.cjs
      - name: Run regression checks
        run: npm test

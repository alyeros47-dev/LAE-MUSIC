name: Server JavaScript syntax check
on:
  push:
    paths:
      - 'server.js'
      - '.github/workflows/server-syntax-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js

name: Focused package referral journeys
on:
  pull_request:
    paths:
      - 'lib/registration-referral.js'
      - 'lib/partner-attribution.js'
      - 'lib/premium-listeners.js'
      - 'lib/account-roles.js'
      - 'lib/account-security.js'
      - 'lib/social-auth.js'
      - 'lib/platform.js'
      - 'server.js'
      - 'web/referral-context.js'
      - 'web/artist-packages.js'
      - 'web/partner-accounting.js'
      - 'web/premium.js'
      - 'web/app.js'
      - 'migrations/036-listener-registration-referral.sql'
      - 'tests/referral-*.cjs'
      - '.github/workflows/referral-journey-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  referral-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: referral_fixture_only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d lae_music_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://postgres:referral_fixture_only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Focused unit and security checks
        run: node tests/referral-context.test.cjs && node tests/social-auth.test.cjs && node tests/artist-packages.test.cjs && node tests/commerce.test.cjs && node tests/premium-international.test.cjs && node tests/account-security.test.cjs && node tests/account-login.test.cjs && node tests/partner-accounting.test.cjs && node tests/platform.test.cjs && node tests/services.test.cjs
      - name: Attribution, account roles and commission regression checks
        run: node tests/registration-referral-migration.cjs && node tests/account-roles-postgres.cjs && node tests/social-auth-postgres.cjs && node tests/premium-referrals-postgres.cjs && node tests/referral-checkout-postgres.cjs
      - run: npx playwright install --with-deps chromium
      - name: Real UI and PostgreSQL with fixture-only Monnify
        run: node tests/referral-journey-browser.cjs && node tests/premium-referrals-browser.cjs && node tests/artist-packages-browser.cjs && node tests/customer-payment-visibility-browser.cjs && node tests/artist-launch-browser.cjs && node tests/controlled-publishing-browser.cjs

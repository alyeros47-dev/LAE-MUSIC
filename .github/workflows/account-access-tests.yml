name: Focused account access and password recovery
on:
  pull_request:
    paths:
      - 'lib/account-*.js'
      - 'lib/background-job.js'
      - 'tests/background-job*.cjs'
      - 'lib/passwords.js'
      - 'web/account-security.js'
      - 'tests/account-recovery-*.cjs'
      - 'tests/account-security*'
      - '.github/workflows/account-access-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lae_account_fixture_only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d lae_music_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://postgres:lae_account_fixture_only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/account-security.test.cjs && node tests/account-login.test.cjs
      - run: LAE_EMAIL_TESTS=1 node tests/smtp.test.cjs
      - run: node tests/background-job-postgres.cjs && node tests/account-recovery-postgres.cjs && node tests/account-roles-postgres.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/account-recovery-browser.cjs

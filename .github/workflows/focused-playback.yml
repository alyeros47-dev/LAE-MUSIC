name: Focused Firefox playback verification
on:
  push:
    branches: [codex/offline-firefox-proof]
permissions:
  contents: read
jobs:
  firefox-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lae_music_ci
          POSTGRES_PASSWORD: lae_ci_fixture_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Verify online and saved MP3 continuation
        env:
          LAE_TEST_BROWSER: firefox
          LAE_DB_TESTS: 'true'
          DATABASE_URL: postgres://postgres:lae_ci_fixture_only@127.0.0.1:5432/lae_music_ci
        run: |
          node tests/offline-persistence-browser.cjs

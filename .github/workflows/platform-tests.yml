name: Read-only social sign-in configuration audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-social-provider-setup:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/social-provider-setup-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect configured names and presence only on the existing service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            assert(process.env.RENDER_API_KEY,'Authorized Render management credential unavailable');
            const r=await fetch('https://api.render.com/v1/services/srv-db84s7m89jmc73c7l9rg/env-vars?limit=100',{headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY},signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only service inventory unavailable');
            const rows=await r.json(),env=Object.fromEntries(rows.map(row=>{const v=row.envVar||row;return[v.key,v.value];}));
            const names=['SOCIAL_AUTH_ENABLED','SOCIAL_AUTH_ORIGIN','SOCIAL_GOOGLE_ENABLED','GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET','SOCIAL_FACEBOOK_ENABLED','FACEBOOK_APP_ID','FACEBOOK_APP_SECRET','FACEBOOK_GRAPH_VERSION','SOCIAL_TIKTOK_ENABLED','TIKTOK_CLIENT_KEY','TIKTOK_CLIENT_SECRET'];
            console.log(JSON.stringify({service_id:'srv-db84s7m89jmc73c7l9rg',required_name_presence:Object.fromEntries(names.map(name=>[name,typeof env[name]==='string'&&!!env[name]])),other_related_variable_names:Object.keys(env).filter(name=>/GOOGLE|FACEBOOK|TIKTOK|OAUTH|SOCIAL/.test(name)&&!names.includes(name)),settings_modified:0,production_data_writes:0,secret_values_exposed:false}));
          })().catch(()=>{console.error('Read-only social configuration audit could not complete; no settings were changed.');process.exitCode=1;});
          JS

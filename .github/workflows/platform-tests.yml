name: Approved song sharing and social sign-in code deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-sharing-and-social-code:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/song-sharing-social-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59d60c0f9d64c1d56142e3444eb275acc1df2735
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 19
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/19'))
          PY
          node --test tests/production-release.test.cjs
      - name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'59d60c0f9d64c1d56142e3444eb275acc1df2735',commit:'cd0f0175623ebaed64bd5f9dcac0d4e2700508cc',ciRun:'41216141915',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>console.log(JSON.stringify(x))});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 19 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify exact live assets, account sessions, existing audio and database records
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_RELEASE_VERIFY: '1'
        run: node scripts/verify-live-release.cjs
      - name: Verify the additive social schema and keep unconfigured providers inactive
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),{Pool}=require('pg'),crypto=require('node:crypto'),fs=require('node:fs');
          (async()=>{
            for(const origin of ['https://lae-music.com','https://lae-music.onrender.com']){
              for(const file of ['web/song-sharing.js','web/social-sign-in.js']){const r=await fetch(origin+'/'+file,{signal:AbortSignal.timeout(30000)});assert(r.ok);const hash=v=>crypto.createHash('sha256').update(v).digest('hex');assert.equal(hash(Buffer.from(await r.arrayBuffer())),hash(fs.readFileSync(file)));}
              const caps=await fetch(origin+'/api/platform/social/providers',{signal:AbortSignal.timeout(30000)});assert(caps.ok);const book=await caps.json();assert.deepEqual(book.providers,[],'Unconfigured providers must stay hidden');assert.deepEqual(Object.keys(book).sort(),['origin','providers']);
            }
            const r=await fetch('https://api.render.com/v1/services/srv-db84s7m89jmc73c7l9rg/env-vars?limit=100',{headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY},signal:AbortSignal.timeout(30000)});assert(r.ok);const env=require('./scripts/audit-existing-service.cjs').inventory(await r.json()),pool=new Pool(require('./lib/database').databaseOptions(env));
            try{const db=await pool.connect();try{await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='10s'");const tables=await db.query("SELECT to_regclass('public.social_identities') IS NOT NULL AS identities,to_regclass('public.social_auth_flows') IS NOT NULL AS flows");assert(tables.rows[0].identities&&tables.rows[0].flows);const migrated=await db.query("SELECT 1 FROM platform_migrations WHERE version='024-social-sign-in.sql'");assert.equal(migrated.rowCount,1);await db.query('ROLLBACK');}finally{db.release();}}finally{await pool.end();}
            console.log(JSON.stringify({new_assets_verified_on_both_origins:true,additive_social_migration_verified:true,unconfigured_social_buttons_inactive:true,environment_changes:0,provider_token_requests:0,account_or_media_writes:0}));
          })().catch(e=>{console.error('Social deployment verification stopped:',e.message);process.exitCode=1;});
          JS
      - run: npx playwright install --with-deps chromium
      - name: Inspect live guest sharing and existing sign-in at mobile and desktop sizes
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{chromium}=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true});fs.mkdirSync('artifacts',{recursive:true});
            try{for(const width of [390,1440]){
              const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce'}),page=await context.newPage(),errors=[],posts=[];
              page.on('pageerror',e=>errors.push(e.message));await page.route('**/api/**',route=>{if(!['GET','HEAD'].includes(route.request().method())){posts.push(new URL(route.request().url()).pathname);return route.abort();}return route.continue();});
              await page.goto('https://lae-music.com',{waitUntil:'domcontentloaded'});await page.getByRole('button',{name:'Explore all music',exact:true}).click();
              const button=page.locator('[data-song-share]').first();await button.waitFor({timeout:45000});const id=await button.getAttribute('data-song-share');await button.click();
              const dialog=page.getByRole('dialog');await dialog.getByRole('heading',{name:'Share this song',exact:true}).waitFor();const field=dialog.getByLabel('Public song link',{exact:true}),url=await field.inputValue();assert.equal(url,'https://lae-music.com/discover?track='+id);const whatsapp=new URL(await dialog.getByRole('link',{name:'Share on WhatsApp',exact:true}).getAttribute('href'));assert.equal(whatsapp.origin,'https://wa.me');assert(whatsapp.searchParams.get('text').includes(url));assert(await dialog.getByRole('button',{name:'Copy song link',exact:true}).isVisible());
              await page.screenshot({path:'artifacts/live-song-sharing-'+width+'.png'});await page.getByRole('button',{name:'Close dialog',exact:true}).click();await page.goto(url,{waitUntil:'domcontentloaded'});await page.getByRole('button',{name:'Share song ↗',exact:true}).waitFor({timeout:45000});
              await page.goto('https://lae-music.com/join?role=artist',{waitUntil:'domcontentloaded'});await page.getByLabel('Password',{exact:true}).waitFor({timeout:45000});assert.equal(await page.locator('[data-social-provider]').count(),0);assert(await page.getByRole('button',{name:'Sign in ↗',exact:true}).isVisible());assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));assert.deepEqual(posts,[]);assert.deepEqual(errors,[]);
              console.log(JSON.stringify({width,live_published_song_share_visible:true,guest_whatsapp_and_copy_options:true,shared_public_song_opens:true,existing_password_sign_in_present:true,unconfigured_social_buttons_hidden:true,application_post_requests:0,paid_generation_requests:0}));await context.close();
            }}finally{await browser.close();}
          })().catch(e=>{console.error('Live sharing inspection stopped:',e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-song-sharing-inspection
          path: artifacts/live-song-sharing-*.png
          if-no-files-found: ignore

name: Approved Studio-only publishing policy release
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      merge_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-publishing-policy:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/publishing-policy-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ffa1827c17d6c1c2583201584b650d7cceb24d9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Bind existing release guards to the approved publishing-policy candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js','tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              for old,new in [('/pulls/12','/pulls/29'),('codex/gospel-phase-one','codex/controlled-publishing'),('706ee59ec4fe07594f40e30dcfab49cd4ba0901b','862bcfbd466c284407bec64edabfbaac0ecd3639')]:
                  assert old in s
                  s=s.replace(old,new)
              p.write_text(s)
          PY
          node --test tests/production-release.test.cjs
      - name: Read-only preflight of existing service, database binding and recovery backup
        if: inputs.phase == 'preflight'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),{release}=require('./lib/production-release');
          (async()=>{const r=await release({mode:'plan',candidate:'9ffa1827c17d6c1c2583201584b650d7cceb24d9',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN});assert.deepEqual(r.feature_keys_to_update,[],'Code-only release refuses environment changes.');console.log(JSON.stringify({...r,status:'preflight_passed',production_writes:0}));})().catch(e=>{console.error('Publishing-policy preflight stopped:',e.message);process.exitCode=1;});
          JS
      - id: deploy
        name: Verify PR 29 merge, backup and exact-candidate CI; deploy existing Render service
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),{release,ID}=require('./lib/production-release');
          (async()=>{
            assert(/^[a-f0-9]{40}$/.test(process.env.APPROVED_MERGE_SHA));
            const r=await fetch('https://api.render.com/v1/services/'+ID+'/deploys?limit=10',{headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY},signal:AbortSignal.timeout(30000)});assert(r.ok);const ds=(await r.json()).map(x=>x.deploy||x),old=ds.find(d=>d.status==='live');assert(/^[a-f0-9]{40}$/.test(old?.commit?.id||''));assert.notEqual(old.commit.id,process.env.APPROVED_MERGE_SHA,'Capture rollback before the new deployment.');fs.appendFileSync(process.env.GITHUB_OUTPUT,'previous_commit='+old.commit.id+'\n');
            const cat=await fetch('https://lae-music.onrender.com/api/music/tracks?limit=50',{signal:AbortSignal.timeout(45000)});assert(cat.ok);const tracks=(await cat.json()).tracks;assert(Array.isArray(tracks)&&tracks.length);fs.writeFileSync('/tmp/lae-policy-existing-tracks.json',JSON.stringify(tracks.map(t=>String(t.id))));
            const out=await release({mode:'deploy',candidate:'9ffa1827c17d6c1c2583201584b650d7cceb24d9',commit:process.env.APPROVED_MERGE_SHA,ciRun:'41901753768',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>{console.log(JSON.stringify(x));if(x.production_deploy_id)fs.appendFileSync(process.env.GITHUB_OUTPUT,'deploy_id='+x.production_deploy_id+'\n');}});console.log(JSON.stringify(out));
          })().catch(e=>{console.error('Publishing-policy release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify live business policy, exact assets, existing music and unchanged Gospel catalogue without paid generation
        if: inputs.phase == 'deploy'
        env:
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto'),policy=require('./lib/publishing-policy');
          const get=async(origin,path)=>{const r=await fetch(origin+path,{redirect:'error',signal:AbortSignal.timeout(45000)});assert(r.ok,'Live route failed: '+path);return r;},hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            for(const origin of ['https://lae-music.onrender.com','https://lae-music.com']){
              for(const file of ['web/business.js','web/app.js','web/artist-packages.js','web/ui.css'])assert.equal(hash(Buffer.from(await(await get(origin,'/'+file+'?release='+process.env.APPROVED_MERGE_SHA)).arrayBuffer())),hash(fs.readFileSync(file)),'Exact served asset '+file);
              const business=await(await get(origin,'/api/platform/business')).json();assert.deepEqual(business,policy.disclosure());
              const plans=await(await get(origin,'/api/plans')).json();assert.deepEqual(plans.plans,policy.packages());assert.equal(plans.publishingPolicy.external_uploads_enabled,false);
              const status=await(await get(origin,'/api/music/status')).json();assert.equal(status.studioOnlyPublishing,true);assert.equal(status.externalUploadsEnabled,false);assert.equal(status.storageConfigured,true);
              for(const path of ['/about','/how-it-works','/publishing-policy','/faq','/artist?legacy=1'])assert((await(await get(origin,path)).text()).includes('src="/web/app.js"'));
              assert.deepEqual(await(await get(origin,'/api/platform/studio/dna/catalog')).json(),require('./lib/studio-launch').catalogue());
              const tracks=(await(await get(origin,'/api/music/tracks?limit=50')).json()).tracks,baseline=JSON.parse(fs.readFileSync('/tmp/lae-policy-existing-tracks.json','utf8'));for(const id of baseline)assert(tracks.some(t=>String(t.id)===id),'Existing published recording retained');
              const stream=await(await get(origin,'/api/music/tracks/'+tracks[0].id+'/stream')).json(),u=new URL(stream.url);assert(u.protocol==='https:'&&u.hostname.endsWith('.r2.cloudflarestorage.com'));
              const audio=await fetch(u,{headers:{Range:'bytes=0-63'},redirect:'error',signal:AbortSignal.timeout(30000)});assert.equal(audio.status,206);assert.equal((await audio.arrayBuffer()).byteLength,64);
            }
            console.log(JSON.stringify({status:'publishing_policy_live_verified',origins:2,exact_assets_per_origin:4,studio_only_publishing:true,prices:[6,10,20],gospel_configuration:'unchanged',existing_catalogue_and_streaming:'passed',paid_requests:0,storage_writes:0,account_or_financial_writes:0}));
          })().catch(e=>{console.error('Live publishing-policy verification failed:',e.message);process.exitCode=1;});
          JS
      - name: Restore previous working application code if the new deployment fails
        if: failure() && inputs.phase == 'deploy' && steps.deploy.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ATTEMPTED_MERGE: ${{ inputs.merge_sha }}
          PREVIOUS_COMMIT: ${{ steps.deploy.outputs.previous_commit }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),{ID}=require('./lib/production-release');
          async function render(path,method='GET',body){assert(method==='GET'||method==='POST'&&path==='/deploys');const r=await fetch('https://api.render.com/v1/services/'+ID+path,{method,headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});assert(r.ok);return r.json();}
          (async()=>{assert(/^[a-f0-9]{40}$/.test(process.env.PREVIOUS_COMMIT));const s=await render('');assert(require('./scripts/audit-existing-service.cjs').serviceValid(s)&&s.id===ID&&s.branch==='main');const d=(await render('/deploys?limit=10')).map(x=>x.deploy||x);if(d.find(x=>x.status==='live')?.commit?.id===process.env.PREVIOUS_COMMIT){console.log(JSON.stringify({rollback:'previous_code_still_live',database_changes:0,environment_changes:0}));return;}assert(d[0]?.commit?.id===process.env.ATTEMPTED_MERGE,'Unrelated deployment detected; rollback refused.');const r=await render('/deploys','POST',{commitId:process.env.PREVIOUS_COMMIT,clearCache:'do_not_clear'});console.log(JSON.stringify({rollback:'previous_code_requested',commit:process.env.PREVIOUS_COMMIT,deploy_id:(r.deploy||r).id,database_changes:0,environment_changes:0}));})().catch(e=>{console.error('Rollback requires inspection:',e.message);process.exitCode=1;});
          JS

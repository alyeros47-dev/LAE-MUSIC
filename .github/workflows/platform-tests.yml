name: Provision isolated internal studio preview
on: workflow_dispatch
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/studio-lab-preview-provision'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 252d5e2e46f740057a90e1f9b5836730017a2239
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Create only the separate free preview and isolated empty usage database
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          LAB_COMMIT: 252d5e2e46f740057a90e1f9b5836730017a2239
          LAB_APPROVED_USD: '0'
        run: node scripts/provision-studio-lab.cjs

name: Read-only Wokie pending-upload diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-upload:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/upload-resume-inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65631ee9a47399ca2f5e403406160b83d94d9001
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Inspect only existing pending records and object metadata; never write storage or reset codes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm'),crypto=require('node:crypto'),{Pool}=require('pg');
          const {inventory,serviceValid}=require('./scripts/audit-existing-service.cjs');
          const norm=x=>String(x||'').normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
          (async()=>{
            const base='https://api.render.com/v1',id='srv-db84s7m89jmc73c7l9rg';
            const read=async path=>{const r=await fetch(base+path,{headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY},signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only service access');return r.json();};
            const raw=await read('/services/'+id),service=raw.service||raw;assert(serviceValid(service));
            const env=inventory(await read('/services/'+id+'/env-vars?limit=100'));
            const pool=new Pool(require('./lib/database').databaseOptions(env));
            let owners=0,records=[],sample=null;
            try{const db=await pool.connect();try{
              await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='15s'");
              const who=await db.query("SELECT id FROM creators WHERE LOWER(REGEXP_REPLACE(display_name,'[^[:alnum:]]','','g'))=$1",['wokie']);owners=who.rowCount;
              if(owners===1){records=(await db.query("SELECT g.title,g.used_at,t.status,t.audio_key,t.cover_key,t.audio_bytes,t.audio_mime,t.cover_mime FROM generation_records g LEFT JOIN music_tracks t ON t.id=g.generated_track_id AND t.creator_id=g.creator_id WHERE g.creator_id=$1 ORDER BY g.id DESC LIMIT 100",[who.rows[0].id])).rows.filter(x=>norm(x.title).includes('mabokolikolo')).slice(0,10);}
              sample=(await db.query("SELECT audio_key FROM music_tracks WHERE status='published' ORDER BY id LIMIT 1")).rows[0];
              await db.query('ROLLBACK');
            }finally{db.release();}}finally{await pool.end();}
            const src=fs.readFileSync('server.js','utf8'),context={crypto,URLSearchParams,Date,require};vm.createContext(context);vm.runInContext(src.slice(src.indexOf('function hmac('),src.indexOf('async function headObject(')),context);
            const config={account:env.R2_ACCOUNT_ID,key:env.R2_ACCESS_KEY_ID,secret:env.R2_SECRET_ACCESS_KEY,bucket:env.R2_BUCKET};
            const head=async key=>{if(!key)return {expected:false};try{const r=await fetch(context.presign(config,key,'head',60),{method:'HEAD',redirect:'error',signal:AbortSignal.timeout(20000)});return {http_status:r.status,bytes:Number(r.headers.get('content-length')),mime:r.headers.get('content-type')};}catch{return {network_failure:true};}};
            const checks=[];for(const record of records)checks.push({code_reserved:!!record.used_at,track_status:record.status||null,audio_expected_bytes:Number(record.audio_bytes)||null,audio:await head(record.audio_key),cover:await head(record.cover_key)});
            let storageErrors=[];
            try{if(service.ownerId){const q=new URLSearchParams({ownerId:service.ownerId,resource:id,limit:'100',direction:'backward',startTime:new Date(Date.now()-12*3600000).toISOString()});const logs=await read('/logs?'+q);for(const row of logs.logs||logs){const msg=String(row.message||'');if(/R2 upload rejected|R2 proxy upload failed/.test(msg)){const code=msg.match(/<Code>([A-Za-z0-9_]+)<\/Code>/)?.[1]||null;storageErrors.push({http_status:Number(msg.match(/R2 upload rejected:\s*(\d+)/)?.[1])||null,code,proxy_network_failure:msg.includes('R2 proxy upload failed')});}}}}catch{}
            console.log(JSON.stringify({account_matches:owners,matching_records:records.length,checks,published_audio_read:await head(sample?.audio_key),recent_storage_errors:storageErrors,database_writes:0,r2_writes:0,generation_requests:0,keys_and_codes_exposed:false}));
          })().catch(e=>{console.error('Read-only diagnosis stopped:',e.message);process.exitCode=1;});
          JS

name: Owner-approved affiliate demo deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-upload-fix:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/affiliate-demo-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19ef0274b02a1a09ee5a7b2fe50f5b30283a95aa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 16
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/16'))
          PY
          node --test tests/production-release.test.cjs
      - name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'19ef0274b02a1a09ee5a7b2fe50f5b30283a95aa',commit:'65631ee9a47399ca2f5e403406160b83d94d9001',ciRun:'41167506053',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>console.log(JSON.stringify(x))});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 16 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify exact live assets, account sessions, existing audio and database records
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_RELEASE_VERIFY: '1'
        run: node scripts/verify-live-release.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify live affiliate demo without real payments or credits
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),crypto=require('node:crypto'),fs=require('node:fs'),{chromium}=require('playwright');
          (async()=>{
            const origin='https://lae-music.com',password=crypto.randomBytes(24).toString('hex');
            const r=await fetch(origin+'/api/register',{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({name:'LAE Affiliate Demo QA',country:'Nigeria',email:'affiliate-demo-'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex')+'@verification.invalid',password,confirmPassword:password,plan:'starter'}),signal:AbortSignal.timeout(45000)});
            assert.equal(r.status,201,'QA artist registration');
            const cookies=r.headers.getSetCookie().map(v=>{const pair=v.split(';')[0],i=pair.indexOf('=');return {name:pair.slice(0,i),value:pair.slice(i+1),domain:'lae-music.com',path:'/',secure:true,httpOnly:true};});
            assert(cookies.length);
            const cookie=cookies.map(c=>c.name+'='+c.value).join('; ');
            const get=async path=>{const x=await fetch(origin+path,{headers:{Cookie:cookie,Origin:origin},signal:AbortSignal.timeout(45000)});assert(x.ok,'Authenticated read '+path);return x.json();};
            const snap=async()=>{const f=await get('/api/platform/finance'),s=await get('/api/artist/subscription'),w=await get('/api/generation/wallet'),a=await get('/api/artist/studio-allowance'),earnings=await get('/api/affiliate/earnings');return {balances:f.balances,history:f.history,withdrawals:f.withdrawals,subscription:s.subscription,active:s.artist_features_active,credits:w.credits,music_used:a.used_generations,earnings};};
            const caps=await get('/api/platform/capabilities');assert.equal(caps.affiliate_demo,true);assert.equal(caps.review_tools,false);assert.equal(caps.payments,false);assert.equal(caps.payouts,false);assert.equal(caps.payment_mode,'disabled');
            const before=await snap();
            const browser=await chromium.launch({headless:true});
            try{for(const width of [390,1440]){
              const context=await browser.newContext({viewport:{width,height:1000}});await context.addCookies(cookies);
              const page=await context.newPage(),blocked=[];
              await page.route('**/api/**',route=>{
                const req=route.request(),path=new URL(req.url()).pathname;
                if(!['GET','HEAD'].includes(req.method())&&!['/api/platform/partners/practice','/api/platform/partners/practice/preview'].includes(path)){blocked.push(path);return route.abort();}
                return route.continue();
              });
              await page.goto(origin+'/partners',{waitUntil:'domcontentloaded'});
              await page.getByRole('link',{name:'Test referrals with demo payments',exact:true}).click();
              await page.getByRole('heading',{name:'Follow the referral. Check the numbers.',exact:true}).waitFor();
              const form=page.locator('#partner-demo-form');
              const run=async()=>{
                const response=page.waitForResponse(r=>r.url().endsWith('/api/platform/partners/practice/preview')&&r.request().method()==='POST');
                await page.getByRole('button',{name:'Run demo payment example',exact:true}).click();
                const r=await response;assert.equal(r.status(),200);const x=await r.json();assert.equal(x.demo,true);assert.equal(x.actual_payment_received_minor,0);assert.equal(x.actual_withdrawable_minor,0);
                await page.waitForFunction(()=>!document.querySelector('#partner-demo-form button[type=submit]').disabled);return x;
              };
              await form.locator('[name=product]').selectOption('artist:professional');await form.locator('[name=payment_state]').selectOption('verified');await form.locator('[name=sale_date]').fill('2026-12-20');
              let x=await run();assert.equal(x.direct.amount_minor,500);assert.equal(x.your_team_projection_minor,200);assert.equal(x.team.period,'2026-Q4');
              await form.locator('[name=depth]').selectOption('1');x=await run();assert.equal(x.your_direct_minor,500);assert.equal(x.your_team_projection_minor,0);
              await form.locator('[name=depth]').selectOption('3');x=await run();assert.equal(x.your_direct_minor,0);assert.equal(x.your_team_projection_minor,0);
              await form.locator('[name=depth]').selectOption('2');await form.locator('[name=product]').selectOption('premium:monthly');await form.locator('[name=sale_date]').fill('2026-12-21');
              x=await run();assert.equal(x.direct.amount_minor,6);assert.equal(x.your_team_projection_minor,3);assert.equal(x.team.period,'2027-Q1');
              await form.locator('[name=payment_state]').selectOption('full_refund');x=await run();assert.equal(x.eligible_minor,0);assert.equal(x.direct.amount_minor,0);assert.equal(x.your_team_projection_minor,0);
              await form.locator('[name=payment_state]').selectOption('held');x=await run();assert.equal(x.eligible_minor,0);
              await form.locator('[name=payment_state]').selectOption('pending');x=await run();assert.equal(x.registration_reward_minor,0);assert.equal(x.direct.amount_minor,0);
              await form.locator('[name=payment_state]').selectOption('verified');await form.locator('[name=product]').selectOption('premium:daily');await form.locator('[name=count]').fill('25');
              x=await run();assert.equal(x.team.projection_minor,10);
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
              fs.mkdirSync('artifacts',{recursive:true});await page.screenshot({path:'artifacts/live-affiliate-demo-'+width+'.png',fullPage:true});
              await page.getByRole('link',{name:'Open saved direct-sale examples',exact:true}).click();
              const reference='live-demo-'+process.env.GITHUB_RUN_ID+'-'+width;
              for(let attempt=0;attempt<2;attempt++){
                const saved=page.locator('#partner-practice-form');await saved.locator('[name=reference]').fill(reference);await saved.locator('[name=plan]').selectOption('starter');await saved.locator('[name=confirm_demo]').check();
                const done=page.waitForResponse(r=>r.url().endsWith('/api/platform/partners/practice')&&r.request().method()==='POST');
                await page.getByRole('button',{name:'Record demo sale',exact:true}).click();const r=await done;assert.equal(r.status(),200);const result=await r.json();assert.equal(result.demo,true);assert.equal(result.replayed,attempt===1);assert.equal(Number(result.sale.commission_minor),90);
                await page.getByText(reference,{exact:true}).waitFor();assert.equal(await page.getByText(reference,{exact:true}).count(),1);
              }
              assert.deepEqual(blocked,[]);assert.deepEqual(await snap(),before,'Real earnings, transfers, subscriptions, credits and music usage unchanged');
              console.log(JSON.stringify({width,demo_enabled:true,real_checkout_disabled:true,direct_rates_verified:true,team_artist_10_percent:true,team_premium_5_percent:true,depth_limit_verified:true,refund_hold_unpaid_verified:true,december_carryover_verified:true,quarter_rounding_verified:true,isolated_demo_persistence_and_replay_verified:true,real_finance_and_credits_unchanged:true,paid_provider_calls:0,r2_writes:0}));
              await context.close();
            }}finally{await browser.close();}
          })().catch(e=>{console.error('Live affiliate demo verification stopped:',e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-affiliate-demo-inspection
          path: artifacts/live-affiliate-demo-*.png
          if-no-files-found: warn

name: Corrective interrupted-upload recovery deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-upload-fix:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/upload-resume-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a9b4340e854b618c8aa6c90accefb513fb42fb4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 17
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/17'))
          PY
          node --test tests/production-release.test.cjs
      - name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'1a9b4340e854b618c8aa6c90accefb513fb42fb4',commit:'6dc60c4413bd593562e55208a11f058c35feef28',ciRun:'41199751324',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>console.log(JSON.stringify(x))});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 17 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify exact live assets, account sessions, existing audio and database records
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_RELEASE_VERIFY: '1'
        run: node scripts/verify-live-release.cjs
      - name: Confirm the reported pending code and original audio without modifying them
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm'),crypto=require('node:crypto'),{Pool}=require('pg');
          const {inventory}=require('./scripts/audit-existing-service.cjs');
          const norm=x=>String(x||'').normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
          (async()=>{
            const r=await fetch('https://api.render.com/v1/services/srv-db84s7m89jmc73c7l9rg/env-vars?limit=100',{headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY},signal:AbortSignal.timeout(30000)});assert(r.ok);
            const env=inventory(await r.json()),pool=new Pool(require('./lib/database').databaseOptions(env));
            const src=fs.readFileSync('server.js','utf8'),context={crypto,URLSearchParams,Date,require};vm.createContext(context);vm.runInContext(src.slice(src.indexOf('function hmac('),src.indexOf('async function headObject(')),context);
            const config={account:env.R2_ACCOUNT_ID,key:env.R2_ACCESS_KEY_ID,secret:env.R2_SECRET_ACCESS_KEY,bucket:env.R2_BUCKET};
            let pending=0,published=0,verifiedAudio=0;
            try{const db=await pool.connect();try{
              await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='15s'");
              const owners=await db.query("SELECT id FROM creators WHERE LOWER(REGEXP_REPLACE(display_name,'[^[:alnum:]]','','g')) LIKE $1",['%wokie%']);assert.equal(owners.rowCount,1,'Reported artist identified');const artist=owners.rows[0].id;
              const records=(await db.query('SELECT g.id,g.title,g.used_at,t.id AS track_id,t.status,t.audio_key FROM generation_records g LEFT JOIN music_tracks t ON t.id=g.generated_track_id AND t.creator_id=g.creator_id WHERE g.creator_id=$1 ORDER BY g.id DESC LIMIT 100',[artist])).rows.filter(x=>norm(x.title).includes('mabokolikolo')&&x.used_at);
              assert(records.length>0,'Existing reserved recording found');
              for(const record of records){
                const saved=await db.query("SELECT result->>'uploadCode' AS code FROM platform_requests WHERE scope=$1 AND result->>'generation_id'=$2",['music-upload:'+artist,String(record.id)]);assert.equal(saved.rowCount,1);
                const checked=await require('./lib/upload-resume').checkCode(db,artist,saved.rows[0].code);
                if(record.status==='pending_upload'){assert.equal(checked.valid,true);assert.equal(checked.resumable,true);pending++;}
                else if(record.status==='published'){assert.equal(checked.valid,false);assert.equal(checked.published,true);published++;}
                if(['pending_upload','published'].includes(record.status)){
                  await require('./lib/music-upload-codes').verifyUploaded({pool:db,artistId:artist,trackId:record.track_id,url:context.presign(config,record.audio_key,'get',60)});verifiedAudio++;
                }
              }
              assert(pending+published>0);await db.query('ROLLBACK');
            }finally{db.release();}}finally{await pool.end();}
            console.log(JSON.stringify({reported_pending_codes_now_resumable:pending,already_published_codes_still_protected:published,existing_audio_hash_verified:verifiedAudio,database_writes:0,r2_writes:0,generation_requests:0,private_codes_or_urls_exposed:false}));
          })().catch(e=>{console.error('Owner upload recovery verification stopped:',e.message);process.exitCode=1;});
          JS
      - run: npx playwright install --with-deps chromium
      - name: Verify real signed-in mobile and desktop upload file pickers without uploading
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),crypto=require('node:crypto'),{chromium}=require('playwright');
          (async()=>{
            const origin='https://lae-music.com';
            const password=crypto.randomBytes(24).toString('hex');
            const r=await fetch(origin+'/api/register',{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({name:'LAE Upload Resume QA',country:'Nigeria',email:'upload-form-'+process.env.GITHUB_RUN_ID+'-'+crypto.randomBytes(4).toString('hex')+'@verification.invalid',password,confirmPassword:password,plan:'starter'}),signal:AbortSignal.timeout(45000)});
            assert.equal(r.status,201,'QA artist registration');
            const cookies=r.headers.getSetCookie().map(v=>{const pair=v.split(';')[0],i=pair.indexOf('=');return {name:pair.slice(0,i),value:pair.slice(i+1),domain:'lae-music.com',path:'/',secure:true,httpOnly:true};});
            assert(cookies.length);
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [390,1440]){
                const context=await browser.newContext({viewport:{width,height:1000}});
                await context.addCookies(cookies);
                const page=await context.newPage(),writes=[];
                await page.route('**/api/**',route=>{
                  if(!['GET','HEAD'].includes(route.request().method())){writes.push(new URL(route.request().url()).pathname);return route.abort();}
                  return route.continue();
                });
                await page.goto(origin+'/workspace?tab=upload',{waitUntil:'domcontentloaded'});
                await page.locator('#upload-form [name=audio]').waitFor({state:'visible'});
                assert(await page.locator('#upload-form [name=cover]').isVisible(),'cover picker visible');
                assert(await page.locator('#upload-form button[type=submit]').isDisabled(),'unpaid QA account cannot publish');
                assert((await page.locator('#upload-access-status').innerText()).includes('active artist package'),'clear entitlement explanation');
                await page.locator('#upload-form [name=uploadCode]').fill('A'.repeat(36));
                assert(await page.locator('#upload-form button[type=submit]').isEnabled(),'complimentary publishing button enabled with generated-song code');
                await page.locator('#upload-form [name=uploadCode]').fill('');
                assert(await page.locator('#upload-form button[type=submit]').isDisabled(),'external publishing remains gated');
                assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'responsive form');
                assert.deepEqual(writes,[],'no production upload, generation or payment requests');
                console.log(JSON.stringify({width,live_audio_picker:true,live_cover_picker:true,publishing_entitlement_preserved:true,complimentary_code_enables_publish:true,production_file_writes:0,paid_generation_requests:0}));
                await page.goto(origin+'/studio',{waitUntil:'domcontentloaded'});
                await page.getByRole('heading',{name:'Your generated songs & history',exact:true}).waitFor();
                assert(await page.locator('#studio-history').isVisible(),'live generation history section');
                console.log(JSON.stringify({width,live_generation_history_visible:true,additional_generation_requests:0}));
                await context.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error('Live upload form verification stopped:',e.message);process.exitCode=1;});
          JS

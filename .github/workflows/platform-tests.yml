name: Approved artist package referral page deployment
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      merge_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-package-referrals:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/package-referral-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ffd45d5109d0ffb77e6527ec75a4ff516fb146b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 22
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/22'))
          PY
          node --test tests/production-release.test.cjs
      - name: Read-only existing service and backup verification before merge
        if: inputs.phase == 'preflight'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const {ID,featureSettings,REQUIRED_JOBS}=require('./lib/production-release');
          const {serviceValid,inventory}=require('./scripts/audit-existing-service.cjs');
          async function get(url,key){const r=await fetch(url,{headers:{Authorization:'Bearer '+key,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only preflight API HTTP '+r.status);return r.json();}
          (async()=>{
            const root='https://api.github.com/repos/alyeros47-dev/LAE-MUSIC',gh=p=>get(root+p,process.env.GITHUB_TOKEN),r=p=>get('https://api.render.com/v1/services/'+ID+p,process.env.RENDER_API_KEY);
            const pr=await gh('/pulls/22'),main=await gh('/git/ref/heads/main');assert.equal(pr.state,'open');assert.equal(pr.head.sha,'7ffd45d5109d0ffb77e6527ec75a4ff516fb146b');assert.equal(pr.base.ref,'main');assert.equal(main.object.sha,'9cc41fe9810d1a546b4f3a6ef79b59f288fbe9c4');
            const run=await gh('/actions/runs/41336493884'),jobs=(await gh('/actions/runs/41336493884/jobs?per_page=100')).jobs;assert.equal(run.head_sha,pr.head.sha);assert.equal(run.conclusion,'success');assert(REQUIRED_JOBS.every(name=>jobs.some(j=>j.name===name&&j.conclusion==='success')));
            const raw=await r(''),service=raw.service||raw;assert(serviceValid(service));assert.equal(service.id,ID);assert.equal(service.branch,'main');assert.equal(service.serviceDetails.runtime,'node');
            const env=inventory(await r('/env-vars?limit=100'));assert(['DATABASE_URL','R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET','MUSICAPI_API_KEY'].every(k=>!!env[k]));assert(!Object.keys(env).some(k=>k.startsWith('LAE_REVIEW_')&&env[k]));const changes=Object.keys(featureSettings(env)).filter(k=>env[k]!==featureSettings(env)[k]);assert.equal(changes.length,0,'Environment changes are not authorized by this referral-page release');
            assert((await require('./lib/neon-recovery-inspection').inspect({key:process.env.NEON_API_KEY,databaseUrl:env.DATABASE_URL})).database_binding_verified);
            const backup=(await get('https://console.neon.tech/api/v2/projects/restless-brook-43273058/branches/br-spring-night-b4y9h9xp',process.env.NEON_API_KEY)).branch;assert.equal(backup.id,'br-spring-night-b4y9h9xp');assert.equal(backup.parent_id,'br-flat-darkness-b42js8ma');assert.equal(backup.name,'lae-release-41141460115-backup');assert(Date.parse(backup.expires_at)>Date.now()+3600000);
            const pool=new (require('pg').Pool)(require('./lib/database').databaseOptions(env));let paidArtists;try{const db=await pool.connect();try{await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='15s'");paidArtists=Number((await db.query("SELECT COUNT(DISTINCT artist_id)::int AS n FROM artist_subscriptions WHERE status='paid' AND starts_at<=NOW() AND expires_at>NOW() AND NOT payment_hold")).rows[0].n);await db.query('ROLLBACK');}finally{db.release();}}finally{await pool.end();}assert.equal(require('./config/payment-merchant.json').checkout_mode,'disabled');console.log(JSON.stringify({preflight:'passed',service_id:ID,candidate:pr.head.sha,ci_run:'41336493884',recovery_backup_verified:true,active_paid_artist_accounts:paidArtists,checkout_enabled:false,existing_configuration_preserved:true,auto_deploy_trigger:service.autoDeployTrigger??service.autoDeploy??'unknown',environment_changes:0,production_writes:0,paid_requests:0}));
          })().catch(e=>{console.error('Pre-merge check stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'7ffd45d5109d0ffb77e6527ec75a4ff516fb146b',commit:process.env.APPROVED_MERGE_SHA,ciRun:'41336493884',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>console.log(JSON.stringify(x))});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 22 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify exact live assets, account sessions, existing audio and database records
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_RELEASE_VERIFY: '1'
        run: node scripts/verify-live-release.cjs
      - name: Install browser for focused public referral-page verification
        if: inputs.phase == 'deploy'
        run: npx playwright install --with-deps chromium
      - name: Verify public package entry and attribution on both phone and laptop
        if: inputs.phase == 'deploy'
        run: |
          node - <<'JS'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto');
          (async()=>{
           for(const origin of ['https://lae-music.com','https://lae-music.onrender.com'])for(const file of ['web/app.js','web/artist-packages.js']){const r=await fetch(origin+'/'+file+'?package-release='+process.env.GITHUB_RUN_ID,{redirect:'error',signal:AbortSignal.timeout(30000)});assert(r.ok);const hash=b=>crypto.createHash('sha256').update(b).digest('hex');assert.equal(hash(Buffer.from(await r.arrayBuffer())),hash(fs.readFileSync(file)));}
           const origin='https://lae-music.com',caps=await(await fetch(origin+'/api/platform/capabilities',{signal:AbortSignal.timeout(30000)})).json();assert.equal(caps.artist_access_mode,'paid_packages_only');assert.equal(caps.payments,false);
           const browser=await require('playwright').chromium.launch({headless:true});let writes=0,requests=0;
           try{for(const width of [390,1440]){const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'reduce'}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.name));
           await context.route('**/api/**',async route=>{requests++;if(!['GET','HEAD'].includes(route.request().method())){writes++;return route.abort('blockedbyclient');}return route.continue();});
           for(const path of ['/start?ref=9&product=growth','/get-started?ref=9&product=growth','/start?legacy=1&ref=9&product=growth','/join?mode=register&ref=9&product=growth']){await page.goto(origin+path);await page.getByRole('heading',{name:'Choose your artist package.',exact:true}).waitFor();assert.equal(await page.locator('[data-package]').count(),3);assert.equal(await page.locator('#page form,#page input[type=email],#page input[type=password]').count(),0);assert.equal(await page.locator('[data-package=growth]').getAttribute('aria-pressed'),'true');assert.equal(await page.title(),'Artist packages | LAE-MUSIC');}
           await page.getByRole('button',{name:'Choose Professional',exact:true}).click();await page.waitForURL(u=>u.pathname==='/start'&&u.searchParams.get('product')==='professional');assert.equal(new URL(page.url()).searchParams.get('ref'),'9');await page.getByText('Professional · $20 USD / year',{exact:true}).waitFor();assert.equal(await page.locator('[data-package=professional]').getAttribute('aria-pressed'),'true');assert(await page.getByRole('heading',{name:'Payment is currently unavailable.',exact:true}).isVisible());assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
           for(const path of ['/join?role=listener&mode=register','/join?role=partner&mode=register','/start#signin']){await page.goto(origin+path);await page.locator('#auth-form').waitFor();assert.equal(await page.locator('[data-package]').count(),0);}
           assert.deepEqual(errors,[]);await context.close();}}
           finally{await browser.close();}
           assert.equal(writes,0);console.log(JSON.stringify({public_package_routes_verified:4,browser_widths:[390,1440],artist_packages:3,referral_preserved_on_selection:true,registration_forms_absent_before_payment:true,free_partner_listener_signup_and_explicit_signin_preserved:true,exact_assets_on_both_origins:true,api_read_requests:requests,account_writes:0,payment_operations:0,provider_generation_calls:0,storage_writes:0,guest_checkout_enabled:false}));
          })().catch(e=>{console.error('Public package entry verification stopped:',e.message);process.exitCode=1;});
          JS

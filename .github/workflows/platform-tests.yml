name: Read-only diagnose live songwriting request
on: workflow_dispatch
permissions: {contents: read}
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/studio-lab-preview-provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: 64584bcc91a4c9238477edde89de8d44b08f5bb5, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --omit=dev
      - name: Inspect only new songwriting job metadata without generating or changing data
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');(async()=>{const id='srv-db84s7m89jmc73c7l9rg',key=process.env.RENDER_API_KEY;async function get(p){const r=await fetch('https://api.render.com/v1'+p,{headers:{Authorization:'Bearer '+key},signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only HTTP '+r.status);return r.json();}const raw=await get('/services/'+id),s=raw.service||raw;console.log(JSON.stringify({owner_id:s.ownerId||s.owner?.id||null}));const vars=Object.fromEntries((await get('/services/'+id+'/env-vars?limit=100')).map(v=>[(v.envVar||v).key,(v.envVar||v).value]));const pool=new(require('pg').Pool)(require('./lib/database').databaseOptions(vars));try{await pool.query('BEGIN READ ONLY');const row=(await pool.query("SELECT c.id,c.created_at,w.credits FROM creators c LEFT JOIN generation_wallets w ON w.creator_id=c.id WHERE c.email='existing-studio-41365928499@verification.invalid'")).rows;console.log(JSON.stringify({controlled_qa_only:row}));await pool.query('ROLLBACK');}finally{await pool.end();}const owner=s.ownerId||s.owner?.id;if(owner){try{const logs=await get('/logs?ownerId='+encodeURIComponent(owner)+'&resource='+id+'&startTime=2026-11-02T00%3A13%3A00Z&endTime=2026-11-02T00%3A15%3A00Z&direction=backward&limit=100');const lines=Array.isArray(logs)?logs:logs.logs||logs.items||[];const selected=lines.map(x=>String(x.message||x.log?.message||x.text||'')).filter(x=>/error|Error|failed|ready|listening/i.test(x));console.log(JSON.stringify({runtime_messages:selected.slice(0,30).map(line=>{for(const v of Object.values(vars))if(v&&v.length>=12)line=line.split(v).join('[redacted]');return line;})}));}catch(e){console.log(JSON.stringify({runtime_logs_available:false,reason:e.message}));}}})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS

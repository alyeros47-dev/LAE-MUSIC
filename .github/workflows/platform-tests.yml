name: Read-only owner-requested song recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-existing-song:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/song-recovery-inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75f6ded4e2d30f247eac52d59e4a97c2e685ebd0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Find the supplied artist and title without altering records or generating music
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),{Pool}=require('pg');
          const {inventory,serviceValid}=require('./scripts/audit-existing-service.cjs');
          const normalize=x=>String(x||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
          (async()=>{
            const root='https://api.render.com/v1/services/srv-db84s7m89jmc73c7l9rg';
            const read=async path=>{const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY},signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only service access');return r.json();};
            const s=await read('');assert(serviceValid(s.service||s),'Existing production service');
            const env=inventory(await read('/env-vars?limit=100'));
            const pool=new Pool(require('./lib/database').databaseOptions(env));
            let tasks=[],history=[],owners=0,matchingCodes=0;
            try{
              const db=await pool.connect();
              try{
                await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='15s'");
                const q=await db.query("SELECT id FROM creators WHERE LOWER(REGEXP_REPLACE(display_name,'[^[:alnum:]]','','g'))=$1",['jojoparty']);
                owners=q.rowCount;
                if(owners===1){
                  const id=q.rows[0].id;
                  tasks=(await db.query("SELECT task_id,status FROM sonic_test_tasks WHERE creator_id=$1 AND status<>'failed' AND task_id NOT LIKE 'sonic-%' ORDER BY created_at DESC LIMIT 5",[id])).rows;
                  history=(await require('./lib/studio-history').studioHistory(db,id)).generations;
                  matchingCodes=(await db.query("SELECT COUNT(*)::int n FROM generation_records WHERE creator_id=$1 AND title ILIKE $2",[id,'%KO SI BRAKE%'])).rows[0].n;
                }
                await db.query('ROLLBACK');
              }finally{db.release();}
            }finally{await pool.end();}
            process.env.MUSICAPI_API_KEY=env.MUSICAPI_API_KEY;
            let matches=0,recoverable=0,reads=0,failures=0;
            for(const task of tasks){
              try{
                reads++;
                const songs=await require('./musicapi-sonic').releaseProvider.clips(task.task_id);
                const found=songs.filter(song=>normalize(song.title).includes(normalize('KO SI BRAKE')));
                matches+=found.length;
                if(history.some(g=>g.generation_reference===task.task_id))recoverable+=found.length;
              }catch{failures++;}
            }
            console.log(JSON.stringify({artist_name_matches:owners,existing_matching_title_records:matchingCodes,owned_recent_tasks:tasks.length,read_only_provider_status_requests:reads,provider_read_failures:failures,matching_completed_songs:matches,matching_songs_in_repaired_history:recoverable,database_writes:0,generation_requests:0,paid_credits_used:0,private_emails_or_media_urls_exposed:false}));
          })().catch(e=>{console.error('Read-only recovery inspection stopped:',e.message);process.exitCode=1;});
          JS

name: Read-only diagnose live songwriting request
on: workflow_dispatch
permissions: {contents: read}
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/studio-lab-preview-provision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: 9a084380698050a1d8695d03e315e93206408ab4, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --omit=dev
      - name: Verify one owner-authorized Kizz Daniel text request using isolated metering, no audio
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{const result=await require('./scripts/verify-real-description-text.cjs').verify({env:{...process.env,LAE_REAL_TEXT_TEST:'owner-authorized'},expectedArtist:'Kizz Daniel',brief:'Create an original three-minute clean secular Afropop and Afrobeats song in natural English and Nigerian Pidgin about friends opening a neighbourhood fashion shop. The musical reference is Kizz Daniel. Research his broad musical qualities automatically and translate them into an original groove, instrumental arrangement, melodic phrasing, rhythmic articulation, expressive dynamics and memorable hook. Use warm guitar, melodic bass and crisp percussion. I mean broad singing and production qualities, not an exact voice clone. Do not copy existing lyrics or melodies. Keep the story about designing clothes, teamwork and welcoming the neighbours; no prayer, poverty or road story. Produce actual complete lyrics and a detailed matching production prompt without asking for optional permission or a legal name.'});assert.equal(result.provider_requests,2);assert.equal(result.model,'gpt-6.1-sol');console.log(JSON.stringify(result));})().catch(e=>{console.error('Controlled artist-reference text verification failed:',e.message);process.exitCode=1;});
          JS

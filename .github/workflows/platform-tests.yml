name: Approved shared account and paid artist access deployment
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      merge_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-paid-artist-access:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/paid-account-roles-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9da4d1743fa556a55a25786b0be9b4a1da36143b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 21
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/21'))
          PY
          node --test tests/production-release.test.cjs
      - name: Read-only existing service and backup verification before merge
        if: inputs.phase == 'preflight'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const {ID,featureSettings,REQUIRED_JOBS}=require('./lib/production-release');
          const {serviceValid,inventory}=require('./scripts/audit-existing-service.cjs');
          async function get(url,key){const r=await fetch(url,{headers:{Authorization:'Bearer '+key,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only preflight API HTTP '+r.status);return r.json();}
          (async()=>{
            const root='https://api.github.com/repos/alyeros47-dev/LAE-MUSIC',gh=p=>get(root+p,process.env.GITHUB_TOKEN),r=p=>get('https://api.render.com/v1/services/'+ID+p,process.env.RENDER_API_KEY);
            const pr=await gh('/pulls/21'),main=await gh('/git/ref/heads/main');assert.equal(pr.state,'open');assert.equal(pr.head.sha,'9da4d1743fa556a55a25786b0be9b4a1da36143b');assert.equal(pr.base.ref,'main');assert.equal(main.object.sha,'4b48c9d31a327210cbb31dacb7ece0ffcc855075');
            const run=await gh('/actions/runs/41252795007'),jobs=(await gh('/actions/runs/41252795007/jobs?per_page=100')).jobs;assert.equal(run.head_sha,pr.head.sha);assert.equal(run.conclusion,'success');assert(REQUIRED_JOBS.every(name=>jobs.some(j=>j.name===name&&j.conclusion==='success')));
            const raw=await r(''),service=raw.service||raw;assert(serviceValid(service));assert.equal(service.id,ID);assert.equal(service.branch,'main');assert.equal(service.serviceDetails.runtime,'node');
            const env=inventory(await r('/env-vars?limit=100'));assert(['DATABASE_URL','R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET','MUSICAPI_API_KEY'].every(k=>!!env[k]));assert(!Object.keys(env).some(k=>k.startsWith('LAE_REVIEW_')&&env[k]));const changes=Object.keys(featureSettings(env)).filter(k=>env[k]!==featureSettings(env)[k]);assert.equal(changes.length,0,'Environment changes are not authorized by this paid-access release');
            assert((await require('./lib/neon-recovery-inspection').inspect({key:process.env.NEON_API_KEY,databaseUrl:env.DATABASE_URL})).database_binding_verified);
            const backup=(await get('https://console.neon.tech/api/v2/projects/restless-brook-43273058/branches/br-spring-night-b4y9h9xp',process.env.NEON_API_KEY)).branch;assert.equal(backup.id,'br-spring-night-b4y9h9xp');assert.equal(backup.parent_id,'br-flat-darkness-b42js8ma');assert.equal(backup.name,'lae-release-41141460115-backup');assert(Date.parse(backup.expires_at)>Date.now()+3600000);
            const pool=new (require('pg').Pool)(require('./lib/database').databaseOptions(env));let paidArtists;try{const db=await pool.connect();try{await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='15s'");paidArtists=Number((await db.query("SELECT COUNT(DISTINCT artist_id)::int AS n FROM artist_subscriptions WHERE status='paid' AND starts_at<=NOW() AND expires_at>NOW() AND NOT payment_hold")).rows[0].n);await db.query('ROLLBACK');}finally{db.release();}}finally{await pool.end();}assert.equal(require('./config/payment-merchant.json').checkout_mode,'disabled');console.log(JSON.stringify({preflight:'passed',service_id:ID,candidate:pr.head.sha,ci_run:'41252795007',recovery_backup_verified:true,active_paid_artist_accounts:paidArtists,checkout_enabled:false,existing_configuration_preserved:true,auto_deploy_trigger:service.autoDeployTrigger??service.autoDeploy??'unknown',environment_changes:0,production_writes:0,paid_requests:0}));
          })().catch(e=>{console.error('Pre-merge check stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'9da4d1743fa556a55a25786b0be9b4a1da36143b',commit:process.env.APPROVED_MERGE_SHA,ciRun:'41252795007',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>console.log(JSON.stringify(x))});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 21 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify exact live assets, account sessions, existing audio and database records
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_RELEASE_VERIFY: '1'
        run: node scripts/verify-live-release.cjs
      - name: Install browser for focused shared-account and paid-access verification
        if: inputs.phase == 'deploy'
        run: npx playwright install --with-deps chromium
      - name: Verify same-email access, paired logout, unpaid artist gates and free partner navigation
        if: inputs.phase == 'deploy'
        run: |
          node - <<'JS'
          'use strict';
          const assert=require('node:assert/strict'),crypto=require('node:crypto'),fs=require('node:fs');
          const origin=process.env.LAE_VERIFY_ORIGIN||'https://lae-music.com';
          assert(['https://lae-music.com','http://127.0.0.1:3187'].includes(origin));
          async function api(path,body,cookie){const r=await fetch(origin+path,{method:body===undefined?'GET':'POST',redirect:'error',headers:{Origin:origin,'Content-Type':'application/json',...(cookie?{Cookie:cookie}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(45000)});return{status:r.status,cookie:r.headers.getSetCookie().map(x=>x.split(';')[0]).join('; '),data:await r.json()};}
          (async()=>{
           // Exact assets and policy marker must precede deliberately invalid negative probes.
           const caps=await api('/api/platform/capabilities');assert.equal(caps.status,200);assert.equal(caps.data.artist_access_mode,'paid_packages_only');assert.equal(caps.data.public_artist_trials,false);
           for(const file of ['web/app.js','web/account-roles.js','web/studio-workflow.js']){const r=await fetch(origin+'/'+file+'?release-check='+process.env.GITHUB_RUN_ID,{redirect:'error',signal:AbortSignal.timeout(30000)});assert(r.ok);const hash=b=>crypto.createHash('sha256').update(b).digest('hex');assert.equal(hash(Buffer.from(await r.arrayBuffer())),hash(fs.readFileSync(file)));}
           const password=crypto.randomBytes(24).toString('hex'),email='linked-qa-'+(process.env.GITHUB_RUN_ID||'local')+'-'+crypto.randomBytes(6).toString('hex')+'@verification.invalid';
           const registration=await api('/api/listener/register',{name:'LAE Linked Access QA',email,password,confirmPassword:password});assert.equal(registration.status,201);const listenerId=registration.data.user.id;
           const linked=await api('/api/platform/account/roles?role=listener',{currentPassword:password,confirm:true,country:'Nigeria'},registration.cookie);assert.equal(linked.status,200);let cookie=linked.cookie;assert(cookie.includes('lae_listener=')&&cookie.includes('lae_session='));
           const both=(await api('/api/platform/session',undefined,cookie)).data;assert.equal(both.listener.id,listenerId);assert.equal(both.artist.email,email);assert.equal(both.listener.email,email);const artistId=both.artist.id;
           const sub=await api('/api/artist/subscription',undefined,cookie);assert.equal(sub.data.artist_features_active,false);assert(!sub.data.subscription);
           assert.equal((await api('/api/generation/wallet',undefined,cookie)).data.credits,0);const allowance=(await api('/api/artist/studio-allowance',undefined,cookie)).data;assert.equal(allowance.active,false);assert.equal(allowance.remaining_generations,0);
           assert.equal((await api('/api/artist/select-plan',{plan:'professional'},cookie)).status,200);assert.equal((await api('/api/artist/subscription',undefined,cookie)).data.artist_features_active,false);
           let denied=0;
           for(const [path,body]of [['/api/music/lyrics-generate',{}],['/api/music/sonic/create',{}],['/api/voice/upload',{consent:false}],['/api/voice/train',{}],['/api/music/upload/start',{}],['/api/music/upload/finish',{}],['/api/platform/studio/releases',{}],['/api/music/sonic/wav',undefined]]){assert.equal((await api(path,body,cookie)).status,402,path);denied++;}
           for(const path of ['/api/affiliate/product-links','/api/affiliate/earnings','/api/platform/partners-overview'])assert.equal((await api(path,undefined,cookie)).status,200,path);
           async function logout(){assert.equal((await api('/api/logout',{},cookie)).status,200);const s=(await api('/api/platform/session',undefined,cookie)).data;assert(!s.artist&&!s.listener);}
           await logout();
           for(const role of ['listener','artist','partner']){const r=await api('/api/platform/account/login',{role,email,password});assert.equal(r.status,200,role);cookie=r.cookie;const s=(await api('/api/platform/session',undefined,cookie)).data;assert.equal(s.artist.id,artistId);assert.equal(s.listener.id,listenerId);if(role!=='partner')await logout();}
           const browser=await require('playwright').chromium.launch({headless:true,...(process.env.LAE_CHROMIUM_PATH?{executablePath:process.env.LAE_CHROMIUM_PATH}:{})});let browserReads=0;
           try{for(const width of [390,1440]){const context=await browser.newContext({viewport:{width,height:1000},reducedMotion:'reduce'}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.name));await context.addCookies(cookie.split('; ').map(pair=>{const index=pair.indexOf('=');return{name:pair.slice(0,index),value:pair.slice(index+1),url:origin,httpOnly:true,secure:origin.startsWith('https:'),sameSite:'Lax'};}));
           await context.route('**/api/**',async route=>{if(!['GET','HEAD'].includes(route.request().method()))return route.abort('blockedbyclient');browserReads++;return route.continue();});
           for(const path of ['/studio','/workspace?tab=upload']){await page.goto(origin+path);await page.getByRole('heading',{name:'Choose a paid artist package.',exact:true}).waitFor();assert.equal(await page.locator('#studio-workflow,#release-upload,input[type=file],#voice-recorder').count(),0);assert(await page.getByRole('link',{name:'My account',exact:true}).first().isVisible());assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));}
           await page.goto(origin+'/partners');await page.getByRole('heading',{name:'Your connections. Real possibility.',exact:true}).waitFor();assert.equal(await page.getByRole('button',{name:'Copy product link',exact:true}).count(),3);assert(await page.getByRole('button',{name:'Copy product link',exact:true}).first().isVisible());assert.equal(errors.length,0);await context.close();}}
           finally{await browser.close();await logout();}
           console.log(JSON.stringify({linked_same_email_login_roles:3,paired_logout_verified:true,unpaid_production_requests_denied:denied,plan_selection_does_not_activate:true,free_partner_endpoints_verified:3,browser_widths:[390,1440],browser_api_reads:browserReads,unpaid_production_forms_hidden:true,new_qa_accounts_unpublished:true,checkout_requests:0,provider_calls:0,storage_writes:0,existing_account_modifications:0}));
          })().catch(e=>{console.error('Linked paid-access verification stopped:',e.message);process.exitCode=1;});
          JS

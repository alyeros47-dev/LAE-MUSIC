name: Approved listener-preference deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-listening-preferences:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/listening-preferences-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f12bcf24d1aa97cc415a54b04a21cc96450ec31
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 18
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/18'))
          PY
          node --test tests/production-release.test.cjs
      - name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'4f12bcf24d1aa97cc415a54b04a21cc96450ec31',commit:'eadbe648016d403714ec3e7b9024a870bd165302',ciRun:'41204387941',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>console.log(JSON.stringify(x))});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 18 release stopped:',e.message);process.exitCode=1;});
          JS
      - run: npx playwright install --with-deps chromium
      - name: Verify the live welcome and strict anonymous listening filters
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto'),{chromium}=require('playwright');
          const taxonomy=require('./web/listening-preferences');
          (async()=>{
            for(const origin of ['https://lae-music.com','https://lae-music.onrender.com']){
              for(const file of ['web/listening-welcome.js','web/listening-preferences.js']){
                const r=await fetch(origin+'/'+file,{signal:AbortSignal.timeout(30000)});assert(r.ok);
                const hash=x=>crypto.createHash('sha256').update(x).digest('hex');
                assert.equal(hash(Buffer.from(await r.arrayBuffer())),hash(fs.readFileSync(file)));
              }
            }
            const browser=await chromium.launch({headless:true});fs.mkdirSync('artifacts',{recursive:true});
            try{for(const width of [390,1440]){
              const context=await browser.newContext({viewport:{width,height:1000}}),page=await context.newPage(),errors=[],writes=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('**/api/**',route=>{if(!['GET','HEAD'].includes(route.request().method())){writes.push(new URL(route.request().url()).pathname);return route.abort();}return route.continue();});
              await page.goto('https://lae-music.com',{waitUntil:'domcontentloaded'});
              const dialog=page.getByRole('dialog');await dialog.waitFor({timeout:45000});
              for(const family of ['Gospel','Afrobeats & Afropop','Reggae & Caribbean'])assert(await dialog.getByLabel(family,{exact:true}).isVisible());
              await dialog.getByLabel('Gospel',{exact:true}).check();await dialog.locator('[data-family=gospel]').getByLabel('Choose categories',{exact:true}).check();await dialog.getByLabel('Worship',{exact:true}).check();
              await page.screenshot({path:'artifacts/live-listening-welcome-'+width+'.png'});
              const result=page.waitForResponse(r=>new URL(r.url()).pathname==='/api/platform/discover'&&new URL(r.url()).searchParams.has('listening')&&new URL(r.url()).searchParams.get('listening'),{timeout:45000});
              await dialog.getByRole('button',{name:'Show my music',exact:true}).click();
              const response=await result;assert(response.ok());const body=await response.json(),preference={version:1,selections:[{family:'gospel',genres:['worship']}]};
              assert(body.tracks.every(t=>taxonomy.matches(t.genre,preference)));assert(body.genres.every(g=>taxonomy.matches(g.genre,preference)));
              await page.getByRole('button',{name:'Choose your music',exact:true}).waitFor();assert.equal(await page.locator('.editorial-home').count(),0);
              await page.reload({waitUntil:'domcontentloaded'});await page.getByRole('button',{name:'Choose your music',exact:true}).waitFor({timeout:45000});
              await page.waitForFunction(()=>typeof document.getElementById('change-listening')?.onclick==='function');assert.equal(await page.getByRole('dialog').count(),0);assert(await page.evaluate(()=>JSON.parse(localStorage.getItem('lae_listening_preferences_v1')).selections[0].genres.includes('worship')));
              await page.getByRole('button',{name:'Choose your music',exact:true}).click();await dialog.getByLabel('Praise',{exact:true}).check();
              const next=page.waitForResponse(r=>new URL(r.url()).pathname==='/api/platform/discover'&&new URL(r.url()).searchParams.get('listening')?.includes('praise'),{timeout:45000});await dialog.getByRole('button',{name:'Show my music',exact:true}).click();const both=await (await next).json();
              assert(both.tracks.every(t=>taxonomy.matches(t.genre,{version:1,selections:[{family:'gospel',genres:['praise','worship']}]})));
              assert.deepEqual(writes,[]);assert.deepEqual(errors,[]);assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
              console.log(JSON.stringify({width,live_welcome:true,multiple_music_families_visible:true,worship_filter_verified:true,praise_and_worship_filter_verified:true,browser_preference_persistence:true,production_write_requests:0,paid_generation_requests:0,matching_worship_songs:body.tracks.length}));
              await context.close();
            }}finally{await browser.close();}
          })().catch(e=>{console.error('Live listening verification stopped:',e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-listener-preferences-inspection
          path: artifacts/live-listening-welcome-*.png
          if-no-files-found: ignore

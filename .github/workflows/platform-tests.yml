name: Platform release candidate verification
on:
  pull_request:
    paths-ignore:
      - "android-app/**"
  workflow_dispatch:
    inputs:
      review_auth_email_sha256:
        description: "Optional SHA-256 account lookup digest; sandbox only, no resets/deployment"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  review-auth-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.review_auth_email_sha256 != '' && github.ref == 'refs/heads/codex/premium-platform-release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/review-auth-diagnostic.test.cjs
      - name: Inspect only the identified sandbox test account
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          REVIEW_AUTH_EMAIL_SHA256: ${{ inputs.review_auth_email_sha256 }}
        run: node scripts/review-auth-diagnostic.cjs
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run test:http
      - run: npm run test:email
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lae_ci_fixture_only
          POSTGRES_DB: lae_music_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lae_music_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:postgres
        env:
          LAE_DB_TESTS: "true"
          DATABASE_URL: postgres://postgres:lae_ci_fixture_only@127.0.0.1:5432/lae_music_ci
      - run: npm run test:upgrade
        env:
          LAE_DB_TESTS: "true"
          DATABASE_URL: postgres://postgres:lae_ci_fixture_only@127.0.0.1:5432/lae_music_ci

  browser-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          LAE_TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: artifacts/

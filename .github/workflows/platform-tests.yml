name: Approved live description-led studio release
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      merge_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-description-studio:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/customer-description-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64584bcc91a4c9238477edde89de8d44b08f5bb5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 24
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/24'))
          PY
          node --test tests/production-release.test.cjs
      - name: Read-only existing service and backup verification before merge
        if: inputs.phase == 'preflight'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const {ID,featureSettings,REQUIRED_JOBS}=require('./lib/production-release');
          const {serviceValid,inventory}=require('./scripts/audit-existing-service.cjs');
          async function get(url,key){const r=await fetch(url,{headers:{Authorization:'Bearer '+key,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(30000)});assert(r.ok,'Read-only preflight API HTTP '+r.status);return r.json();}
          (async()=>{
            const root='https://api.github.com/repos/alyeros47-dev/LAE-MUSIC',gh=p=>get(root+p,process.env.GITHUB_TOKEN),r=p=>get('https://api.render.com/v1/services/'+ID+p,process.env.RENDER_API_KEY);
            const pr=await gh('/pulls/24'),main=await gh('/git/ref/heads/main');assert.equal(pr.state,'open');assert.equal(pr.head.sha,'64584bcc91a4c9238477edde89de8d44b08f5bb5');assert.equal(pr.base.ref,'main');assert.equal(main.object.sha,'2f9876c0130fda3e3961a53aa7ac7767c58209a6');
            const run=await gh('/actions/runs/41359996461'),jobs=(await gh('/actions/runs/41359996461/jobs?per_page=100')).jobs;assert.equal(run.head_sha,pr.head.sha);assert.equal(run.conclusion,'success');assert(REQUIRED_JOBS.every(name=>jobs.some(j=>j.name===name&&j.conclusion==='success')));
            const raw=await r(''),service=raw.service||raw;assert(serviceValid(service));assert.equal(service.id,ID);assert.equal(service.branch,'main');assert.equal(service.serviceDetails.runtime,'node');
            const env=inventory(await r('/env-vars?limit=100'));assert(['DATABASE_URL','R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET','MUSICAPI_API_KEY'].every(k=>!!env[k]));assert(!Object.keys(env).some(k=>k.startsWith('LAE_REVIEW_')&&env[k]));const changes=Object.keys(featureSettings(env)).filter(k=>env[k]!==featureSettings(env)[k]);assert.equal(changes.length,0,'Environment changes are not authorized by this internal-demo release');
            assert((await require('./lib/neon-recovery-inspection').inspect({key:process.env.NEON_API_KEY,databaseUrl:env.DATABASE_URL})).database_binding_verified);
            const backup=(await get('https://console.neon.tech/api/v2/projects/restless-brook-43273058/branches/br-spring-night-b4y9h9xp',process.env.NEON_API_KEY)).branch;assert.equal(backup.id,'br-spring-night-b4y9h9xp');assert.equal(backup.parent_id,'br-flat-darkness-b42js8ma');assert.equal(backup.name,'lae-release-41141460115-backup');assert(Date.parse(backup.expires_at)>Date.now()+3600000);
            const origin='https://lae-music.com',auth=await fetch(origin+'/api/admin/login',{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({password:env.ADMIN_KEY}),signal:AbortSignal.timeout(20000)});assert(auth.ok,'Existing owner sign-in needs repair before release');const cookie=auth.headers.getSetCookie().map(x=>x.split(';')[0]).join('; '),ownerSession=await(await fetch(origin+'/api/platform/session',{headers:{Cookie:cookie}})).json();assert.equal(ownerSession.admin_user?.role,'owner','Existing owner session must work');const pool=new (require('pg').Pool)(require('./lib/database').databaseOptions(env));let paidArtists;try{const db=await pool.connect();try{await db.query('BEGIN READ ONLY');await db.query("SET LOCAL statement_timeout='15s'");paidArtists=Number((await db.query("SELECT COUNT(DISTINCT artist_id)::int AS n FROM artist_subscriptions WHERE status='paid' AND starts_at<=NOW() AND expires_at>NOW() AND NOT payment_hold")).rows[0].n);const fs=require('node:fs'),crypto=require('node:crypto'),rows=(await db.query('SELECT version,checksum FROM platform_migrations ORDER BY version')).rows,files=fs.readdirSync('migrations').filter(x=>/^\d+.*\.sql$/.test(x)).sort();for(const row of rows){assert(files.includes(row.version),'Unknown applied migration');assert.equal(row.checksum,crypto.createHash('sha256').update(fs.readFileSync('migrations/'+row.version)).digest('hex'));}assert.deepEqual(files.filter(f=>!rows.some(r=>r.version===f)),[]);assert.equal(rows.length,26);await db.query('ROLLBACK');}finally{db.release();}}finally{await pool.end();}assert.equal(require('./config/payment-merchant.json').checkout_mode,'disabled');console.log(JSON.stringify({preflight:'passed',service_id:ID,candidate:pr.head.sha,ci_run:'41359996461',recovery_backup_verified:true,pending_migrations:0,rollback_commit:'2f9876c0130fda3e3961a53aa7ac7767c58209a6',existing_migration_checksums_preserved:true,active_paid_artist_accounts:paidArtists,checkout_enabled:false,existing_configuration_preserved:true,auto_deploy_trigger:service.autoDeployTrigger??service.autoDeploy??'unknown',environment_changes:0,production_writes:0,paid_requests:0}));
          })().catch(e=>{console.error('Pre-merge check stopped:',e.message);process.exitCode=1;});
          JS
      - id: deploy
        name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'64584bcc91a4c9238477edde89de8d44b08f5bb5',commit:process.env.APPROVED_MERGE_SHA,ciRun:'41359996461',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>{console.log(JSON.stringify(x));if(x.production_deploy_id)require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'deploy_id='+x.production_deploy_id+'\n');}});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 24 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Verify exact live assets, account sessions, existing audio and database records
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_RELEASE_VERIFY: '1'
        run: node scripts/verify-live-release.cjs

      - name: Install browser for one real customer-text verification
        if: inputs.phase == 'deploy'
        run: npx playwright install --with-deps chromium
      - name: Correct verifier timeout without changing the tested application
        if: inputs.phase == 'deploy'
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          p=Path('scripts/verify-live-description.cjs')
          s=p.read_text()
          old="await page.waitForFunction(()=>document.querySelector('#customer-song-style')?.value.length>100,{timeout:220000});"
          assert old in s
          s=s.replace(old,"await page.waitForFunction(()=>document.querySelector('#customer-song-style')?.value.length>100 || document.querySelector('#customer-song-status')?.classList.contains('error'),undefined,{timeout:220000});\n  assert(!await page.locator('#customer-song-status').evaluate(el=>el.classList.contains('error')), 'The customer songwriting request reported a failure; inspect its metered phase before retrying.');")
          p.write_text(s)
          PYFIX
          node --check scripts/verify-live-description.cjs
      - name: Verify real clean-secular generation through the live customer interface
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_LIVE_TEXT_VERIFY: owner-authorized
        run: |
          node - <<'JS'
          require('./scripts/verify-live-description.cjs').verify().then(r=>console.log(JSON.stringify(r))).catch(e=>{console.error('Live customer-text verification failed:',e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always() && inputs.phase == 'deploy'
        with:
          name: live-customer-text-proof
          path: artifacts/live-*
      - name: Restore the known working code if the new deployment fails verification
        if: failure() && inputs.phase == 'deploy' && steps.deploy.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ATTEMPTED_MERGE: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),id='srv-db84s7m89jmc73c7l9rg',old='2f9876c0130fda3e3961a53aa7ac7767c58209a6';
          async function api(p,method='GET',body){assert(method==='GET'||method==='POST'&&p==='/deploys');const r=await fetch('https://api.render.com/v1/services/'+id+p,{method,headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});assert(r.ok);return r.json();}
          (async()=>{const s=await api('');assert(s.id===id&&s.branch==='main'&&s.repo.replace(/\.git$/,'')==='https://github.com/alyeros47-dev/LAE-MUSIC');const ds=(await api('/deploys?limit=10')).map(x=>x.deploy||x),live=ds.find(d=>d.status==='live');if(live?.commit?.id===old){console.log(JSON.stringify({rollback:'previous_code_still_live',commit:old,database_restored:false}));return;}assert(ds[0]?.commit?.id===process.env.ATTEMPTED_MERGE,'An unrelated deployment appeared; automatic rollback refused');const d=await api('/deploys','POST',{commitId:old,clearCache:'do_not_clear'});console.log(JSON.stringify({rollback:'requested_known_good_code',commit:old,deploy_id:(d.deploy||d).id,database_restored:false,environment_changes:0}));})().catch(()=>{console.error('Automatic rollback needs inspection; no database or environment was changed.');process.exitCode=1;});
          JS

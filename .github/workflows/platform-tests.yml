name: Read-only studio configuration audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/studio-lab-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect existing services and verify model availability without generation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          async function get(url,key){const r=await fetch(url,{headers:{Authorization:'Bearer '+key,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(20000)});assert(r.ok,'Read-only service inspection HTTP '+r.status);return r.json();}
          (async()=>{for(const [name,id]of [['production','srv-db84s7m89jmc73c7l9rg'],['review','srv-dbfmk5ss728c73ded300']]){const raw=await get('https://api.render.com/v1/services/'+id,process.env.RENDER_API_KEY),s=raw.service||raw;assert.equal(s.id,id);assert.equal(s.repo.replace(/\.git$/,''),'https://github.com/alyeros47-dev/LAE-MUSIC');const rows=await get('https://api.render.com/v1/services/'+id+'/env-vars?limit=100',process.env.RENDER_API_KEY),env={};for(const row of rows){const e=row.envVar||row;env[e.key]=e.value;}let model={id:'gpt-6.1-sol',available:false,http_status:null};if(env.OPENAI_API_KEY){const r=await fetch('https://api.openai.com/v1/models/gpt-6.1-sol',{headers:{Authorization:'Bearer '+env.OPENAI_API_KEY},redirect:'error',signal:AbortSignal.timeout(15000)});model.http_status=r.status;if(r.ok)model.available=(await r.json()).id==='gpt-6.1-sol';}const deploys=await get('https://api.render.com/v1/services/'+id+'/deploys?limit=1',process.env.RENDER_API_KEY),d=deploys[0]?.deploy||deploys[0];console.log(JSON.stringify({service:name,id,branch:s.branch,runtime:s.serviceDetails?.runtime,url:s.serviceDetails?.url,disk:!!s.serviceDetails?.disk,disk_mount:s.serviceDetails?.disk?.mountPath||null,review_marker:env.LAE_REVIEW_ENVIRONMENT||null,persistent_review:env.LAE_REVIEW_PERSISTENT_STORAGE==='1',external_database_configured:!!env.DATABASE_URL,admin_key_configured:!!env.ADMIN_KEY,lyrics_key_configured:!!env.OPENAI_API_KEY,configured_lyrics_model:env.OPENAI_LYRICS_MODEL||'gpt-6.1-sol (code default)',selected_model_probe:model,current_deploy:{status:d?.status,commit:d?.commit?.id},environment_changes:0,production_writes:0,paid_requests:0}));}})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS

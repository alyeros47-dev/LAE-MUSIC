name: Verify authorized real customer-description text
on: workflow_dispatch
permissions: {contents: read}
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/studio-lab-preview-provision'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a0581c45512c23bacb4210f7066ff6678f8846b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --omit=dev
      - name: Align only the private key and perform one real text generation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_REAL_TEXT_TEST: owner-authorized
        run: |
          node - <<'JS'
          (async()=>{console.log(JSON.stringify(await require('./scripts/align-studio-lab-admin.cjs').align()));console.log(JSON.stringify(await require('./scripts/verify-real-description-text.cjs').verify()));})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorized-real-text-verification
          path: artifacts/real-description-text.json

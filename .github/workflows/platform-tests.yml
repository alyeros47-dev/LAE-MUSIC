name: Platform release candidate verification
on:
  pull_request:
    paths-ignore:
      - "android-app/**"
  workflow_dispatch:
    inputs:
      existing_service_audit:
        description: "Read-only inspection of existing production service and schema; no deployment or database writes"
        required: false
        type: boolean
        default: false
      review_auth_email_sha256:
        description: "Optional SHA-256 account lookup digest; sandbox only, no resets/deployment"
        required: false
        type: string
        default: ""
      review_lyrics_model_check:
        description: "Read-only verification of the two approved lyrics models; no billed generation or deployment"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  existing-service-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.existing_service_audit && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/premium-platform-release'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev
      - name: Read existing production configuration and schema without changes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/audit-existing-service.cjs
  review-auth-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (inputs.review_auth_email_sha256 != '' || inputs.review_lyrics_model_check) && github.ref == 'refs/heads/codex/premium-platform-release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/review-auth-diagnostic.test.cjs
      - name: Read-only sandbox account or approved model check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          REVIEW_AUTH_EMAIL_SHA256: ${{ inputs.review_auth_email_sha256 }}
          REVIEW_LYRICS_MODEL_CHECK: ${{ inputs.review_lyrics_model_check }}
        run: node scripts/review-auth-diagnostic.cjs
  review-persistence:
    if: github.event_name != 'workflow_dispatch' || (inputs.review_auth_email_sha256 == '' && !inputs.review_lyrics_model_check && !inputs.existing_service_audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build isolated review image without service credentials
        run: docker build -f deploy/review.Dockerfile -t lae-review-persistence-ci .
      - name: Replace container and verify retained account, audio and provider budget
        env:
          LAE_REVIEW_PERSISTENCE_TESTS: "1"
          LAE_REVIEW_TEST_IMAGE: lae-review-persistence-ci
        run: node tests/review-persistence-container.cjs
  application:
    if: github.event_name != 'workflow_dispatch' || (inputs.review_auth_email_sha256 == '' && !inputs.review_lyrics_model_check && !inputs.existing_service_audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run test:http
      - run: npm run test:email
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/

  postgres:
    if: github.event_name != 'workflow_dispatch' || (inputs.review_auth_email_sha256 == '' && !inputs.review_lyrics_model_check && !inputs.existing_service_audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lae_ci_fixture_only
          POSTGRES_DB: lae_music_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lae_music_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:postgres
        env:
          LAE_DB_TESTS: "true"
          DATABASE_URL: postgres://postgres:lae_ci_fixture_only@127.0.0.1:5432/lae_music_ci
      - run: npm run test:upgrade
        env:
          LAE_DB_TESTS: "true"
          DATABASE_URL: postgres://postgres:lae_ci_fixture_only@127.0.0.1:5432/lae_music_ci

  browser-compatibility:
    if: github.event_name != 'workflow_dispatch' || (inputs.review_auth_email_sha256 == '' && !inputs.review_lyrics_model_check && !inputs.existing_service_audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          LAE_TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: artifacts/

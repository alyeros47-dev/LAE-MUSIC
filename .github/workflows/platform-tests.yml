name: Approved artist-reference and clarification repair release
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      merge_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  deploy-approved-description-studio:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/customer-description-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lae-existing-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a084380698050a1d8695d03e315e93206408ab4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bind existing release guards to the owner-approved PR 26
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['lib/production-release.js', 'tests/production-release.test.cjs']:
              p=Path(name)
              s=p.read_text()
              assert s.count('/pulls/12')==1
              p.write_text(s.replace('/pulls/12','/pulls/26'))
          PY
          node --test tests/production-release.test.cjs
      - id: deploy
        name: Verify the approved merge, backup, CI and existing Render service; deploy exact merge
        if: inputs.phase == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const {release}=require('./lib/production-release');
          (async()=>{
            const r=await release({mode:'deploy',candidate:'9a084380698050a1d8695d03e315e93206408ab4',commit:process.env.APPROVED_MERGE_SHA,ciRun:'41374155797',key:process.env.RENDER_API_KEY,neonKey:process.env.NEON_API_KEY,githubToken:process.env.GITHUB_TOKEN,record:x=>{console.log(JSON.stringify(x));if(x.production_deploy_id)require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'deploy_id='+x.production_deploy_id+'\n');}});
            console.log(JSON.stringify(r));
          })().catch(e=>{console.error('PR 26 release stopped:',e.message);process.exitCode=1;});
          JS
      - name: Install browser for free live reply verification
        if: inputs.phase == 'deploy'
        run: npx playwright install --with-deps chromium
      - name: Verify live artist reply controls on phone and laptop without paid calls
        if: inputs.phase == 'deploy'
        env:
          APPROVED_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto'),{chromium}=require('playwright');
          (async()=>{const origin='https://lae-music.com',hash=b=>crypto.createHash('sha256').update(b).digest('hex');for(const file of ['web/description-studio.js','web/app.js']){const r=await fetch(origin+'/'+file+'?release='+process.env.APPROVED_MERGE_SHA,{signal:AbortSignal.timeout(30000)});assert(r.ok);assert.equal(hash(Buffer.from(await r.arrayBuffer())),hash(fs.readFileSync(file)));}
          const cap=await(await fetch(origin+'/api/platform/capabilities')).json();assert(cap.description_studio&&cap.public_artist_trials&&!cap.affiliate_demo,'Existing customer testing settings changed.');for(const path of ['/api/platform/studio/catalog','/api/platform/studio/dna/catalog'])assert((await fetch(origin+path,{signal:AbortSignal.timeout(45000)})).ok);
          const password=crypto.randomBytes(24).toString('hex'),registration=await fetch(origin+'/api/register',{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify({name:'Reference flow verification',country:'Nigeria',email:'reference-ui-'+process.env.GITHUB_RUN_ID+'@verification.invalid',password,confirmPassword:password,plan:'starter'})});assert.equal(registration.status,201);const cookies=registration.headers.getSetCookie().map(v=>{const first=v.split(';')[0],i=first.indexOf('=');return{name:first.slice(0,i),value:first.slice(i+1),url:origin,secure:true,httpOnly:true,sameSite:'Strict'};});assert(cookies.length);
          const browser=await chromium.launch();try{for(const width of [390,1440]){let posts=0;const context=await browser.newContext({viewport:{width,height:1000}});await context.addCookies(cookies);const page=await context.newPage();page.setDefaultTimeout(60000);const question='Do you mean the singer Alex Smith or the producer Alex Smith?',id=crypto.randomUUID(),result={...require('./tests/studio-lab-fixtures.cjs').clone(require('./tests/studio-lab-fixtures.cjs').output),style:require('./tests/studio-lab-fixtures.cjs').output.provider_style,description_mode:true};
          await page.route('**/api/music/**',async route=>{const req=route.request(),path=new URL(req.url()).pathname;if(path==='/api/music/description/start'){const data=req.postDataJSON();posts++;if(posts===2){assert.equal(data.question,question);assert.equal(data.answer,'The singer, with melodic phrasing and an original Afropop groove.');}else assert.equal(posts,1);return route.fulfill({contentType:'application/json',body:JSON.stringify({id,status:'running'})});}if(path.startsWith('/api/music/description/jobs/'))return route.fulfill({contentType:'application/json',body:JSON.stringify({id,status:'complete',result:posts===1?{status:'clarify',question}:result})});assert.equal(req.method(),'GET','No paid music or voice request is authorized by this UI check.');return route.continue();});
          await page.goto(origin+'/studio');const description=page.getByLabel('Describe the song you want',{exact:true});try{await description.waitFor()}catch(error){if(await page.getByText('Request protection is temporarily unavailable. Try again shortly.',{exact:true}).count()){await page.reload();await description.waitFor();}else throw error;}
          await description.fill('Create a clean original celebration with musical qualities inspired by Alex Smith.');await page.getByRole('button',{name:'Generate lyrics & style',exact:true}).click();const answer=page.getByLabel('Your answer',{exact:true}),go=page.getByRole('button',{name:'Continue with my answer',exact:true});await answer.waitFor();await go.click();assert.equal(posts,1);await answer.fill('The singer, with melodic phrasing and an original Afropop groove.');await go.click();await page.waitForFunction(()=>document.querySelector('#detailed-style-output')?.value.length>100,undefined,{timeout:30000});assert.equal(posts,2);assert.equal(await answer.isVisible(),false);await page.reload();await description.waitFor();assert.equal(await page.locator('#detailed-style-output').inputValue(),result.detailed_style);assert.equal(await answer.isVisible(),false);const wallet=await page.evaluate(()=>fetch('/api/generation/wallet').then(r=>r.json()));assert.equal(wallet.credits,2);fs.mkdirSync('artifacts',{recursive:true});await page.screenshot({path:'artifacts/live-reference-reply-'+width+'.png',fullPage:true});await context.close();console.log(JSON.stringify({live_artist_reply_ui:'PASS',width,visible_answer_and_continue:true,question_answer_context:'PASS',completed_reply_survives_refresh:true,provider_responses:'mocked_for_UI_only',customer_credits_spent:0,musicapi_requests:0}));}}finally{await browser.close();}})().catch(e=>{console.error('Live artist-reference UI verification failed:',e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always() && inputs.phase == 'deploy'
        with:
          name: live-artist-reference-proof
          path: artifacts/live-*
      - name: Restore the known working code if the new deployment fails verification
        if: failure() && inputs.phase == 'deploy' && steps.deploy.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ATTEMPTED_MERGE: ${{ inputs.merge_sha }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict'),id='srv-db84s7m89jmc73c7l9rg',old='0652b9304aca71d2c0f362a286300aef04a00ef4';
          async function api(p,method='GET',body){assert(method==='GET'||method==='POST'&&p==='/deploys');const r=await fetch('https://api.render.com/v1/services/'+id+p,{method,headers:{Authorization:'Bearer '+process.env.RENDER_API_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});assert(r.ok);return r.json();}
          (async()=>{const s=await api('');assert(s.id===id&&s.branch==='main'&&s.repo.replace(/\.git$/,'')==='https://github.com/alyeros47-dev/LAE-MUSIC');const ds=(await api('/deploys?limit=10')).map(x=>x.deploy||x),live=ds.find(d=>d.status==='live');if(live?.commit?.id===old){console.log(JSON.stringify({rollback:'previous_code_still_live',commit:old,database_restored:false}));return;}assert(ds[0]?.commit?.id===process.env.ATTEMPTED_MERGE,'An unrelated deployment appeared; automatic rollback refused');const d=await api('/deploys','POST',{commitId:old,clearCache:'do_not_clear'});console.log(JSON.stringify({rollback:'requested_known_good_code',commit:old,deploy_id:(d.deploy||d).id,database_restored:false,environment_changes:0}));})().catch(()=>{console.error('Automatic rollback needs inspection; no database or environment was changed.');process.exitCode=1;});
          JS

name: Read-only inspect partial lab provisioning
on: workflow_dispatch
permissions: {contents: read}
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/studio-lab-metering-inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only test-branch metadata, without database writes
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          node - <<'JS'
          const base='https://console.neon.tech/api/v2/projects/restless-brook-43273058';
          async function get(p){const r=await fetch(base+p,{headers:{Authorization:'Bearer '+process.env.NEON_API_KEY},signal:AbortSignal.timeout(20000)});console.log(JSON.stringify({path:p,http:r.status}));return r.ok?r.json():null;}
          (async()=>{const all=await get('/branches'),b=all?.branches?.find(b=>b.name==='lae-studio-description-lab');console.log(JSON.stringify({lab_branch_exists:!!b,branch:b?{id:b.id,name:b.name,init_source:b.init_source,current_state:b.current_state,default:b.default,expires_at:b.expires_at}:null}));if(b){const e=await get('/branches/'+b.id+'/endpoints');console.log(JSON.stringify({endpoints:e?.endpoints?.map(x=>({id:x.id,current_state:x.current_state,branch_id:x.branch_id,type:x.type}))}));const roles=await get('/branches/'+b.id+'/roles'),db=await get('/branches/'+b.id+'/databases');console.log(JSON.stringify({lab_role_exists:roles?.roles?.some(r=>r.name==='lae_studio_lab_owner'),lab_database_exists:db?.databases?.some(d=>d.name==='lae_studio_lab')}));}})().catch(()=>{console.error('Read-only metadata check could not complete.');process.exitCode=1;});
          JS

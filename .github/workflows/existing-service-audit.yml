name: Read existing LAE-MUSIC integration requirements
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-diagnostic:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/database-quota-incident'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: node --test tests/database-quota-diagnostic.test.cjs
      - name: Read verified production database quota without changing anything
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/diagnose-database-quota.cjs --history

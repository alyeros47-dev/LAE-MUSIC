name: Read existing LAE-MUSIC integration requirements
on:
  workflow_dispatch:
    inputs:
      voice_owned_check:
        description: "Read-only Jane Esther recording and waveform check; no training or generation"
        required: false
        type: boolean
        default: false
      voice_profile_check:
        description: "Read-only voice configuration and existing task inspection; no training or generation"
        required: false
        type: boolean
        default: false
      isolated_recovery:
        description: "Create an expiring private backup and rehearse migration/restore; never modify production"
        required: false
        type: boolean
        default: false
      recovery_backup_branch:
        description: "Optional previously created owned backup branch"
        required: false
        type: string
        default: ""
      recovery_backup_run:
        description: "Original run ID for the optional saved backup"
        required: false
        type: string
        default: ""
      password_email_check:
        description: "Owner-requested Gmail verification: SMTP connection or one isolated listener reset round-trip"
        required: false
        type: choice
        options: ["", smtp, roundtrip]
        default: ""
permissions:
  contents: read
jobs:
  owned-voice-preflight:
    if: inputs.voice_owned_check && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/voice-profile-launch-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: node tests/owned-voice-inspection.test.cjs
      - name: Inspect only the owner-selected saved recording without paid operations
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/inspect-owned-voice.cjs
  voice-launch-inspection:
    if: inputs.voice_profile_check && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/voice-profile-launch-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: node tests/voice-launch-inspection.test.cjs
      - name: Check existing configuration and task results without recording or paid calls
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/inspect-voice-launch.cjs
  inspect:
    if: ${{ !inputs.isolated_recovery && github.repository == 'alyeros47-dev/LAE-MUSIC' && (github.ref == 'refs/heads/codex/premium-platform-release' || github.ref == 'refs/heads/codex/music-dna-foundation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Inspect existing service and database without changing either
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/audit-existing-service.cjs

  recovery:
    if: inputs.isolated_recovery && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/music-dna-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lae-existing-database-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev
      - name: Verify isolated recovery guards
        run: node --test tests/neon-recovery-rehearsal.test.cjs tests/neon-recovery.test.cjs
      - name: Restore and rehearse migrations only in a private disposable database
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          LAE_EXISTING_RECOVERY_REHEARSAL: "1"
          LAE_RECOVERY_BACKUP_BRANCH: ${{ inputs.recovery_backup_branch }}
          LAE_RECOVERY_BACKUP_RUN: ${{ inputs.recovery_backup_run }}
        run: node scripts/rehearse-existing-recovery.cjs

  password-email:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/account-password-recovery' && inputs.password_email_check != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: lae-password-recovery-live-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/gmail-recovery-verification.test.cjs
      - if: inputs.password_email_check == 'roundtrip'
        run: npx playwright install --with-deps chromium
      - name: Verify only the configured Gmail sender and the requested recovery flow
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_GMAIL_VERIFY_MODE: ${{ inputs.password_email_check }}
        run: node scripts/verify-gmail-recovery.cjs

name: Read existing LAE-MUSIC integration requirements
on:
  workflow_dispatch:
    inputs:
      voice_account_lookup:
        description: "SHA-256 digest of the owner-selected public artist name; never submit a recording fingerprint or credentials"
        required: false
        type: string
        default: ""
      voice_export_consent:
        description: "Confirm only after the recording owner explicitly agrees to send their sample to MusicAPI for this test"
        required: false
        type: boolean
        default: false
      voice_acceptance_run:
        description: "One authorized owner-selected voice test: max 5 training + 20 music credits, no paid retry"
        required: false
        type: boolean
        default: false
      voice_owned_check:
        description: "Read-only owner-selected recording and waveform check; no training or generation"
        required: false
        type: boolean
        default: false
      voice_profile_check:
        description: "Read-only voice configuration and existing task inspection; no training or generation"
        required: false
        type: boolean
        default: false
      isolated_recovery:
        description: "Create an expiring private backup and rehearse migration/restore; never modify production"
        required: false
        type: boolean
        default: false
      recovery_backup_branch:
        description: "Optional previously created owned backup branch"
        required: false
        type: string
        default: ""
      recovery_backup_run:
        description: "Original run ID for the optional saved backup"
        required: false
        type: string
        default: ""
      password_email_check:
        description: "Owner-requested Gmail verification: SMTP connection or one isolated listener reset round-trip"
        required: false
        type: choice
        options: ["", smtp, roundtrip]
        default: ""
permissions:
  contents: read
jobs:
  owned-voice-acceptance:
    if: inputs.voice_acceptance_run && inputs.voice_export_consent && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/voice-profile-launch-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    concurrency:
      group: lae-pr53-owned-voice-25-credit-test
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: voice_ci_only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_VOICE_ACCEPTANCE: '25'
      LAE_VOICE_EXPORT_CONSENT: 'confirmed'
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://postgres:voice_ci_only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify one-use budget, owned recording and existing voice handler before spending
        run: |
          node --test tests/voice-acceptance-budget.test.cjs tests/owned-voice-inspection.test.cjs tests/voice-production.test.cjs tests/voice-sample.test.cjs
          node scripts/accept-owned-voice.cjs --local-preflight
      - name: Confirm the current saved recording without paid provider requests
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/accept-owned-voice.cjs --external-preflight
      - name: Ensure the real audio decoder is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - run: npx playwright install --with-deps chromium
      - name: Reserve the dated one-use provider budget without spending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/accept-owned-voice.cjs --claim
      - uses: actions/upload-artifact@v4
        with:
          name: lae-pr53-owned-voice25-20261116
          path: voice-acceptance-results/claim.json
          if-no-files-found: error
          retention-days: 30
      - name: One real training and, only if ready, one personal-voice generation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/accept-owned-voice.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-voice-test-journal-${{ github.run_id }}
          path: voice-acceptance-results/*.json
          if-no-files-found: ignore
          retention-days: 30
  owned-voice-preflight:
    if: inputs.voice_owned_check && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/voice-profile-launch-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: node tests/owned-voice-inspection.test.cjs
      - name: Inspect only the owner-selected saved recording without paid operations
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/inspect-owned-voice.cjs
  voice-launch-inspection:
    if: inputs.voice_profile_check && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/voice-profile-launch-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - run: node tests/voice-launch-inspection.test.cjs
      - name: Check existing configuration and task results without recording or paid calls
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/inspect-voice-launch.cjs
  inspect:
    if: ${{ !inputs.isolated_recovery && github.repository == 'alyeros47-dev/LAE-MUSIC' && (github.ref == 'refs/heads/codex/premium-platform-release' || github.ref == 'refs/heads/codex/music-dna-foundation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Inspect existing service and database without changing either
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/audit-existing-service.cjs

  recovery:
    if: inputs.isolated_recovery && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/music-dna-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lae-existing-database-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev
      - name: Verify isolated recovery guards
        run: node --test tests/neon-recovery-rehearsal.test.cjs tests/neon-recovery.test.cjs
      - name: Restore and rehearse migrations only in a private disposable database
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          LAE_EXISTING_RECOVERY_REHEARSAL: "1"
          LAE_RECOVERY_BACKUP_BRANCH: ${{ inputs.recovery_backup_branch }}
          LAE_RECOVERY_BACKUP_RUN: ${{ inputs.recovery_backup_run }}
        run: node scripts/rehearse-existing-recovery.cjs

  password-email:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/account-password-recovery' && inputs.password_email_check != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: lae-password-recovery-live-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/gmail-recovery-verification.test.cjs
      - if: inputs.password_email_check == 'roundtrip'
        run: npx playwright install --with-deps chromium
      - name: Verify only the configured Gmail sender and the requested recovery flow
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_GMAIL_VERIFY_MODE: ${{ inputs.password_email_check }}
        run: node scripts/verify-gmail-recovery.cjs

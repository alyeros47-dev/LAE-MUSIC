name: Read existing LAE-MUSIC integration requirements
on:
  workflow_dispatch:
    inputs:
      isolated_recovery:
        description: "Create an expiring private backup and rehearse migration/restore; never modify production"
        required: false
        type: boolean
        default: false
      recovery_backup_branch:
        description: "Optional previously created owned backup branch"
        required: false
        type: string
        default: ""
      recovery_backup_run:
        description: "Original run ID for the optional saved backup"
        required: false
        type: string
        default: ""
      password_email_check:
        description: "Owner-requested Gmail verification: SMTP connection or one isolated listener reset round-trip"
        required: false
        type: choice
        options: ["", smtp, roundtrip, trace, artist-lookup]
        default: ""
      reset_recipient_sha256:
        description: "SHA-256 of the one owner-reported reset email; no plaintext recipient or token"
        required: false
        type: string
        default: ""
      artist_name_sha256:
        description: "Digest of one owner-requested artist name; no broad account listing"
        required: false
        type: string
        default: ""
      lookup_public_key:
        description: "Public encryption key for returning the artist lookup privately"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ !inputs.isolated_recovery && github.repository == 'alyeros47-dev/LAE-MUSIC' && (github.ref == 'refs/heads/codex/premium-platform-release' || github.ref == 'refs/heads/codex/music-dna-foundation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Inspect existing service and database without changing either
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/audit-existing-service.cjs

  recovery:
    if: inputs.isolated_recovery && github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/music-dna-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lae-existing-database-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev
      - name: Verify isolated recovery guards
        run: node --test tests/neon-recovery-rehearsal.test.cjs tests/neon-recovery.test.cjs
      - name: Restore and rehearse migrations only in a private disposable database
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          LAE_EXISTING_RECOVERY_REHEARSAL: "1"
          LAE_RECOVERY_BACKUP_BRANCH: ${{ inputs.recovery_backup_branch }}
          LAE_RECOVERY_BACKUP_RUN: ${{ inputs.recovery_backup_run }}
        run: node scripts/rehearse-existing-recovery.cjs

  password-email:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/account-password-recovery' && inputs.password_email_check != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: lae-password-recovery-live-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/gmail-recovery-verification.test.cjs
      - if: inputs.password_email_check == 'roundtrip'
        run: npx playwright install --with-deps chromium
      - name: Verify only the configured Gmail sender and the requested recovery flow
        if: inputs.password_email_check != 'trace' && inputs.password_email_check != 'artist-lookup'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_GMAIL_VERIFY_MODE: ${{ inputs.password_email_check }}
        run: node scripts/verify-gmail-recovery.cjs
      - if: inputs.password_email_check == 'trace'
        run: node tests/reset-delivery-trace.test.cjs
      - name: Trace only the owner-reported reset request without changing production
        if: inputs.password_email_check == 'trace'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_RESET_TARGET_SHA256: ${{ inputs.reset_recipient_sha256 }}
        run: node scripts/trace-reset-delivery.cjs
      - if: inputs.password_email_check == 'artist-lookup'
        run: node tests/artist-access-lookup.test.cjs
      - name: Read the requested artist and return only a session-encrypted result
        if: inputs.password_email_check == 'artist-lookup'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_ARTIST_NAME_SHA256: ${{ inputs.artist_name_sha256 }}
          LAE_LOOKUP_PUBLIC_KEY: ${{ inputs.lookup_public_key }}
        run: node scripts/lookup-artist-access.cjs

name: Configure isolated review integrations
# Deploy review updates explicitly so active mobile tests are not reset by code pushes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lae-music-isolated-review-provisioning
  cancel-in-progress: false
jobs:
  configure:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/premium-platform-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production database and email dependencies
        run: npm ci --omit=dev
      - name: Test independent environment safeguards
        run: node --test tests/review-integrations.test.cjs tests/review-provider-budget.test.cjs tests/review-storage.test.cjs tests/review-accounts.test.cjs
      - name: Verify the actual sandbox container before configuration
        run: |
          docker build -f deploy/review.Dockerfile -t lae-integrations-ci .
          docker run -d --name lae-integrations-ci --memory=512m -p 127.0.0.1:3116:10000 -e ADMIN_KEY=isolated-integration-ci-only-key -e 'LAE_REVIEW_ARTIST_SNAPSHOT={"version":1,"scope":"artist_profiles_without_credentials","captured_at":"2026-10-27T00:00:00.000Z","artists":[{"source_id":"99999","display_name":"Isolated imported artist","country":"Nigeria","bio":"Isolated fixture","plan":"growth"}]}' lae-integrations-ci
          LAE_REVIEW_FRESH_TESTS=1 LAE_REVIEW_CONTAINER_TESTS=1 LAE_REVIEW_ARTIST_IMPORT_TESTS=1 LAE_REVIEW_FIXTURE_ADMIN_KEY=isolated-integration-ci-only-key node tests/review-container-smoke.cjs
      - name: Stop only the CI integration container
        if: always()
        run: docker rm -f lae-integrations-ci 2>/dev/null || true
      - name: Configure and verify only the review sandbox
        env:
          LAE_IMPORT_NEON_ARTISTS: "0"
          LAE_BOOTSTRAP_REVIEW_R2: "0"
          LAE_VERIFY_REVIEW_STORAGE: "0"
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SANDBOX_NEON_DATABASE_URL: ${{ secrets.SANDBOX_NEON_DATABASE_URL }}
          SANDBOX_R2_ACCOUNT_ID: ${{ secrets.SANDBOX_R2_ACCOUNT_ID }}
          SANDBOX_R2_ACCESS_KEY_ID: ${{ secrets.SANDBOX_R2_ACCESS_KEY_ID }}
          SANDBOX_R2_SECRET_ACCESS_KEY: ${{ secrets.SANDBOX_R2_SECRET_ACCESS_KEY }}
          SANDBOX_R2_BUCKET: ${{ secrets.SANDBOX_R2_BUCKET }}
        run: node scripts/configure-review-integrations.cjs

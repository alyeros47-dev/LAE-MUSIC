name: Configure isolated review integrations
# Deploy review updates explicitly so active mobile tests are not reset by code pushes.
on:
  workflow_dispatch:
    inputs:
      authorized_music_credits:
        description: "Owner-authorized MusicAPI test ceiling; exactly two create_music operations maximum"
        type: choice
        required: false
        default: "0"
        options: ["0", "40"]
      gospel_preview:
        description: "Create a separate FREE read-only Gospel interface preview; no provider keys or existing-site changes"
        type: choice
        required: false
        default: none
        options: [none, publish, verify, paid40]
      persistence_mode:
        description: "unchanged deploys normal review code; plan is read-only; activate requires explicit cost approval"
        type: choice
        required: true
        default: unchanged
        options: [unchanged, plan, activate]
      approve_monthly_charge:
        description: "Owner-approved SANDBOX ONLY service plus 1 GB disk, estimated USD 7.25/month"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: lae-music-isolated-review-provisioning
  cancel-in-progress: false
jobs:
  configure:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/premium-platform-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production database and email dependencies
        run: npm ci --omit=dev
      - name: Test independent environment safeguards
        run: node --test tests/review-integrations.test.cjs tests/review-provider-budget.test.cjs tests/review-storage.test.cjs tests/review-accounts.test.cjs
      - name: Verify the actual sandbox container before configuration
        run: |
          docker build -f deploy/review.Dockerfile -t lae-integrations-ci .
          docker run -d --name lae-integrations-ci --memory=512m -p 127.0.0.1:3116:10000 -e ADMIN_KEY=isolated-integration-ci-only-key -e 'LAE_REVIEW_ARTIST_SNAPSHOT={"version":1,"scope":"artist_profiles_without_credentials","captured_at":"2026-10-27T00:00:00.000Z","artists":[{"source_id":"99999","display_name":"Isolated imported artist","country":"Nigeria","bio":"Isolated fixture","plan":"growth"}]}' lae-integrations-ci
          LAE_REVIEW_FRESH_TESTS=1 LAE_REVIEW_CONTAINER_TESTS=1 LAE_REVIEW_ARTIST_IMPORT_TESTS=1 LAE_REVIEW_FIXTURE_ADMIN_KEY=isolated-integration-ci-only-key node tests/review-container-smoke.cjs
          docker exec --user 0 lae-integrations-ci mkdir -p /app/tests
          docker cp tests/review-quotas-postgres.cjs lae-integrations-ci:/app/tests/review-quotas-postgres.cjs
          docker exec --user 0 -e LAE_REVIEW_QUOTA_TESTS=1 lae-integrations-ci node tests/review-quotas-postgres.cjs
          docker cp tests/review-voice-postgres.cjs lae-integrations-ci:/app/tests/review-voice-postgres.cjs
          docker exec --user 0 -e LAE_REVIEW_VOICE_TESTS=1 lae-integrations-ci node tests/review-voice-postgres.cjs
          docker cp tests/review-releases-postgres.cjs lae-integrations-ci:/app/tests/review-releases-postgres.cjs
          docker cp tests/fixtures lae-integrations-ci:/app/tests/fixtures
          docker exec --user 0 lae-integrations-ci chmod -R a+rX /app/tests
          docker exec --user postgres -e LAE_REVIEW_RELEASE_TESTS=1 lae-integrations-ci node tests/review-releases-postgres.cjs
      - name: Verify accounts and media survive container replacement
        env:
          LAE_REVIEW_PERSISTENCE_TESTS: "1"
          LAE_REVIEW_TEST_IMAGE: lae-integrations-ci
        run: node tests/review-persistence-container.cjs
      - name: Stop only the CI integration container
        if: always()
        run: docker rm -f lae-integrations-ci 2>/dev/null || true
      - name: Plan storage or apply an explicitly approved sandbox-only upgrade
        if: inputs.persistence_mode != 'unchanged'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PERSISTENCE_MODE: ${{ inputs.persistence_mode }}
          OWNER_APPROVED: ${{ inputs.approve_monthly_charge }}
        run: |
          unset LAE_APPROVE_REVIEW_STORAGE_COST
          if [ "$PERSISTENCE_MODE" = activate ] && [ "$OWNER_APPROVED" = true ]; then
            export LAE_APPROVE_REVIEW_STORAGE_COST=I_APPROVE_SANDBOX_7_25_MONTHLY
          fi
          node scripts/prepare-review-persistence.cjs
      - name: Configure and verify only the review sandbox
        if: inputs.persistence_mode == 'unchanged' || (inputs.persistence_mode == 'activate' && inputs.approve_monthly_charge == true)
        env:
          LAE_IMPORT_NEON_ARTISTS: "0"
          LAE_BOOTSTRAP_REVIEW_R2: "0"
          LAE_VERIFY_REVIEW_STORAGE: "0"
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SANDBOX_NEON_DATABASE_URL: ${{ secrets.SANDBOX_NEON_DATABASE_URL }}
          SANDBOX_R2_ACCOUNT_ID: ${{ secrets.SANDBOX_R2_ACCOUNT_ID }}
          SANDBOX_R2_ACCESS_KEY_ID: ${{ secrets.SANDBOX_R2_ACCESS_KEY_ID }}
          SANDBOX_R2_SECRET_ACCESS_KEY: ${{ secrets.SANDBOX_R2_SECRET_ACCESS_KEY }}
          SANDBOX_R2_BUCKET: ${{ secrets.SANDBOX_R2_BUCKET }}
        run: node scripts/configure-review-integrations.cjs

  gospel-inspection-readiness:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/gospel-phase-one' && inputs.persistence_mode == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test read-only inspection guards
        run: node --test tests/gospel-preview.test.cjs
      - name: Inspect existing sandbox without replacing it
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/inspect-gospel-preview.cjs

  gospel-read-only-preview:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/gospel-phase-one' && inputs.gospel_preview == 'publish' && inputs.approve_monthly_charge == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test tests/gospel-preview.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/gospel-inspection-browser.cjs
      - name: Verify keyless inspection image
        run: |
          docker build -f deploy/gospel-inspection.Dockerfile -t lae-inspection-ci .
          docker run -d --name lae-inspection-ci -p 127.0.0.1:3217:10000 lae-inspection-ci
          node -e 'const wait=()=>new Promise(r=>setTimeout(r,1000));(async()=>{for(let i=0;i<20;i++){try{const r=await fetch("http://127.0.0.1:3217/health");const j=await r.json();if(j.inspection_only===true&&j.paid_calls_possible===false)return;}catch{}await wait();}throw Error("Inspection image unavailable");})().catch(e=>{console.error(e);process.exitCode=1;});'
      - name: Stop only inspection test container
        if: always()
        run: docker rm -f lae-inspection-ci 2>/dev/null || true
      - name: Create only the separate free read-only preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/provision-gospel-inspection.cjs

  gospel-lyrics-focused-verification:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/gospel-phase-one' && inputs.gospel_preview == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Verify message, diversity, credit and studio contracts using mocks
        run: node --test tests/lyrics-originality.test.cjs tests/gospel-launch.test.cjs tests/services.test.cjs tests/studio-profiles.test.cjs tests/studio-workflow.test.cjs tests/lyrics-library.test.cjs tests/music-dna.test.cjs tests/music-dna-g1.test.cjs tests/music-dna-g4.test.cjs tests/music-dna-g6.test.cjs tests/music-dna-mood.test.cjs tests/gospel-preview.test.cjs
      - name: Verify concurrent saves and refunds on disposable PostgreSQL
        run: |
          docker run -d --name lae-originality-ci -p 127.0.0.1:55439:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=lae_originality_fixture_only -e POSTGRES_DB=lae_music_ci postgres:16
          for i in $(seq 1 30); do docker exec lae-originality-ci pg_isready -U postgres && break; sleep 1; done
          LAE_DB_TESTS=true DATABASE_URL=postgres://postgres:lae_originality_fixture_only@127.0.0.1:55439/lae_music_ci node tests/lyrics-originality-postgres.cjs
      - name: Stop only the disposable originality database
        if: always()
        run: docker rm -f lae-originality-ci 2>/dev/null || true
      - run: npx playwright install --with-deps chromium
      - name: Verify actual mobile and desktop studio including own lyrics
        run: node tests/gospel-launch-browser.cjs && node tests/gospel-inspection-browser.cjs && node tests/automatic-song-codes-browser.cjs

  authorized-real-audio-acceptance:
    if: github.repository == 'alyeros47-dev/LAE-MUSIC' && github.ref == 'refs/heads/codex/gospel-phase-one' && inputs.gospel_preview == 'paid40' && inputs.authorized_music_credits == '40' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Verify the paid-request and artifact replay guards before any spend
        run: node --test tests/paid-audio-budget.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Require real audio decoder before any spend
        run: |
          if ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1
      - name: Create a fresh disposable acceptance database
        run: |
          docker run -d --name lae-paid-audio-ci -p 127.0.0.1:55441:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=lae_paid_audio_fixture_only -e POSTGRES_DB=lae_music_ci postgres:16
          for i in $(seq 1 30); do docker exec lae-paid-audio-ci pg_isready -U postgres && break; sleep 1; done
      - name: Verify the real local account and entitlement flow before reserving the paid budget
        env:
          LAE_DB_TESTS: "true"
          DATABASE_URL: postgres://postgres:lae_paid_audio_fixture_only@127.0.0.1:55441/lae_music_ci
        run: node scripts/paid-audio-acceptance.cjs --local-preflight
      - name: Refuse any existing claim for this one-time authorized budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAE_MUSICAPI_BUDGET: "40"
        run: node scripts/paid-audio-acceptance.cjs --claim
      - name: Persist the budget claim BEFORE a provider write
        uses: actions/upload-artifact@v4
        with:
          name: lae-pr12-musicapi-authorized40-20261030
          path: paid-results/claim.json
          retention-days: 90
          if-no-files-found: error
      - name: Run the two authorized music requests in isolation; never retry ambiguous submission
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          LAE_MUSICAPI_BUDGET: "40"
          LAE_DB_TESTS: "true"
          DATABASE_URL: postgres://postgres:lae_paid_audio_fixture_only@127.0.0.1:55441/lae_music_ci
        run: node scripts/paid-audio-acceptance.cjs
      - name: Preserve private audio and acceptance journal, including incomplete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lae-pr12-paid-audio-results-${{ github.run_id }}
          path: paid-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Remove only the disposable acceptance database
        if: always()
        run: docker rm -f lae-paid-audio-ci 2>/dev/null || true

name: Android listening app
on:
  push:
    paths: ['android-app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Tests, lint and inspection APKs
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - name: Inspect release bundle and native page alignment
        run: python3 android-app/scripts/inspect-release-bundle.py android-app/app/build/outputs/bundle/release/app-release.aab > android-app/release-binary-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: lae-unsigned-play-review-bundle
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
            android-app/release-binary-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: lae-music-listening-preview
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lae-android-instrumentation
          path: android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-and-lint-results
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.*
  device-checks:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: lae-music-listening-preview
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: lae-android-instrumentation
          path: testapk
      - name: Enable KVM for the disposable Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android test image with bounded download retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install "system-images;android-${{ matrix.api }};google_apis;x86_64"; then exit 0; fi
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android-app/scripts/emulator-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence-api-${{ matrix.api }}
          path: evidence/

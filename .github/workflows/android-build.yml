name: Android build
on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Diagnose and build Android APK
        working-directory: android-app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-diagnostics
          java -version 2>&1 | tee build-diagnostics/java.txt
          gradle --version 2>&1 | tee build-diagnostics/gradle.txt
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build-diagnostics/build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-app/build-diagnostics/
          if-no-files-found: warn
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lae-music-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

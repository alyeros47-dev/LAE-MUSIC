name: Original-currency affiliate withdrawal checks
on:
  pull_request:
    paths: ['lib/affiliate-*.js', 'lib/payments/monnify-disbursements.js', 'lib/premium-listeners.js', 'lib/partner-*.js', 'lib/platform.js', 'lib/finance.js', 'lib/payments/refunds.js', 'lib/admin-auth.js', 'web/affiliate-payouts.js', 'web/app.js', 'config/affiliate-payouts.json', 'migrations/040-affiliate-native-payouts.sql', 'tests/affiliate-native*', '.github/workflows/affiliate-native-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-withdrawals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lae_ci
          POSTGRES_PASSWORD: native_payout_fixture_only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lae_ci -d lae_music_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://lae_ci:native_payout_fixture_only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/monnify-disbursements.test.cjs && node tests/monnify.test.cjs && node tests/affiliate-native.test.cjs && node tests/customer-support.test.cjs && node tests/public-information.test.cjs
      - run: node tests/affiliate-native-postgres.cjs
      - name: Preserve payment verification, activation, referrals, refunds and creator milestones
        run: node tests/monnify-postgres.cjs && node tests/premium-referrals-postgres.cjs && node tests/artist-package-commissions-postgres.cjs && node tests/refunds-postgres.cjs && node tests/creator-milestones-postgres.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/affiliate-native-browser.cjs

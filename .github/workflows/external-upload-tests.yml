name: External upload membership checks
on:
  push:
    branches: [codex/external-upload-memberships]
  pull_request:
    paths: ['lib/external-*', 'config/external-upload-packages.json', 'migrations/042-external-upload-memberships.sql', 'tests/external-*', 'web/external-uploads.js', '.github/workflows/external-upload-tests.yml']
permissions:
  contents: read
jobs:
  external-uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lae_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lae_ci -d lae_music_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://lae_ci:local-test-only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/external-uploads-postgres.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/external-uploads-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-upload-previews
          path: artifacts/external-*.png

name: Customer support focused checks
on:
  push:
    branches: [codex/customer-support-assistant]
  pull_request:
    paths: ['lib/customer-support.js', 'lib/support-knowledge.js', 'config/customer-support.json', 'migrations/039-customer-support.sql', 'web/customer-support*', 'web/index.html', 'web/app.js', 'lib/platform.js', 'tests/customer-support*', '.github/workflows/customer-support-tests.yml']
  workflow_dispatch:
    inputs:
      real_text_check:
        description: Three synthetic support-text requests using the existing API; no music generation
        type: boolean
        default: false
      configure_contact:
        description: Set only the approved WhatsApp contact after deployment
        type: boolean
        default: false
      whatsapp_number:
        description: Official public business contact, with country code
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: customer-support-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lae_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lae_ci -d lae_music_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://lae_ci:local-test-only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/customer-support.test.cjs
      - run: node tests/customer-support-postgres.cjs
      - run: node --test tests/platform.test.cjs tests/player.test.cjs tests/admin-security.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/customer-support-browser.cjs
      - run: node tests/continuous-playback-browser.cjs
      - if: github.event_name == 'workflow_dispatch' && inputs.real_text_check
        name: Bounded real support-text check, no customer or music credits
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/verify-customer-support.cjs text
      - if: github.event_name == 'workflow_dispatch' && inputs.configure_contact
        name: Configure only the approved support contact
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SUPPORT_WHATSAPP_NUMBER: ${{ inputs.whatsapp_number }}
        run: node scripts/verify-customer-support.cjs contact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-support-browser-checks
          path: artifacts/customer-support-*.png

name: WhatsApp campaign landing pages
on:
  push:
    branches: [codex/whatsapp-campaign-pages]
  pull_request:
    paths: ['config/community-campaigns.json', 'lib/community-campaigns.js', 'migrations/041-community-campaigns.sql', 'web/community-campaigns*', 'web/campaign-logo.webp', 'lib/platform.js', 'web/app.js', 'tests/community-campaigns*', '.github/workflows/community-campaigns-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lae_ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: lae_music_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lae_ci -d lae_music_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LAE_DB_TESTS: 'true'
      DATABASE_URL: postgres://lae_ci:local-test-only@127.0.0.1:5432/lae_music_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/community-campaigns.test.cjs tests/platform.test.cjs
      - run: node tests/community-campaigns-postgres.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/community-campaigns-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-campaign-previews
          path: artifacts/community-*.png

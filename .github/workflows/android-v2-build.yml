name: Android V2 clean foundation
on:
  push:
    paths:
      - 'android-v2/**'
      - '.github/workflows/android-v2-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK with diagnostic logs
        working-directory: android-v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee android-v2-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v2-build-log
          path: android-v2/android-v2-build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lae-music-v2-debug-apk
          path: android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
